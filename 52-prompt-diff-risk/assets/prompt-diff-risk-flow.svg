<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">prompt-diff-risk: two revisions of a system prompt compared statement by statement, sorted into four dimensions, ending in ALLOW, REVIEW or BLOCK and the probe slices to run</title>
  <desc id="desc">Five-stage flow showing how an old and a new prompt revision, an optional tool catalogue and an optional probe file move through a load and validate step, a pairing of old and new statements, a classification into constraints, tools, scope, tone or other, a rule that the highest class wins, and a mapping of each finding to the probe slices to run. The result is ALLOW, REVIEW or BLOCK, which sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts no gate, reading every change and running the full probe set, and prompt-diff-risk on 70 synthetic prompt pull requests.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">prompt-diff-risk - classify a prompt change before it merges</text>
  <text x="20" y="52" class="subheader">Four dimensions are read with word lists. The highest class wins, and each finding names probe slices.</text>

  <rect x="20" y="66" width="359" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 70 prompt pull requests, 54 probes in 9 slices</text>

  <rect x="20" y="100" width="161" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . READ</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">old and new prompt,</text>
  <text x="30" y="177" class="stage-sub">tool catalogue, probes</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>
  <line x1="183" y1="166" x2="196" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="199" y="100" width="161" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . PAIR</text>
  <text x="209" y="142" class="stage-title">Pair statements</text>
  <text x="209" y="162" class="stage-sub">split into sentences,</text>
  <text x="209" y="177" class="stage-sub">match old to new by</text>
  <text x="209" y="192" class="stage-sub">token overlap</text>
  <text x="209" y="212" class="meta-strong">70 planted PRs</text>
  <line x1="362" y1="166" x2="375" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="378" y="100" width="161" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . CLASSIFY</text>
  <text x="388" y="142" class="stage-title">Four dimensions</text>
  <text x="388" y="162" class="stage-sub">rules, tools, scope,</text>
  <text x="388" y="177" class="stage-sub">tone; anything else</text>
  <text x="388" y="192" class="stage-sub">goes to review</text>
  <text x="388" y="212" class="meta-strong">19 of 22 blocked</text>
  <line x1="541" y1="166" x2="554" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="557" y="100" width="161" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . DECIDE</text>
  <text x="567" y="142" class="stage-title">Highest class wins</text>
  <text x="567" y="162" class="stage-sub">weakened rule or write</text>
  <text x="567" y="177" class="stage-sub">tool granted: BLOCK</text>
  <text x="567" y="192" class="stage-sub">unknown: REVIEW</text>
  <text x="567" y="212" class="meta-block">7 of 52 risky pass</text>
  <line x1="720" y1="166" x2="733" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="736" y="100" width="161" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . SLICES</text>
  <text x="746" y="142" class="stage-title">Name the probes</text>
  <text x="746" y="162" class="stage-sub">tool access, dimension</text>
  <text x="746" y="177" class="stage-sub">and topic words map to</text>
  <text x="746" y="192" class="stage-sub">probe slices</text>
  <text x="746" y="212" class="meta-strong">504 of 3780 probes</text>

  <path d="M 816 232 L 816 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . REVIEW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">BLOCK exits 1 by default, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">45 of 52 risky: slices hold the failing probe</text>
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Check passes or fails</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">reviewed word lists</text>
  <text x="742" y="328" class="stage-sub">decision record</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No gate</text>
  <text x="32" y="406" class="meta-block">0 of 70 run a probe</text>
  <text x="32" y="424" class="stage-sub">74 failing probes reach users unseen</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Read all, run the full set</text>
  <text x="332" y="406" class="meta-block">70 of 70 read, 3780 probe runs</text>
  <text x="332" y="424" class="stage-sub">25.7% of the flags are harmless</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">prompt-diff-risk</text>
  <text x="632" y="406" class="meta-strong">19 of 22 high-risk blocked, 504 runs</text>
  <text x="632" y="424" class="stage-sub">known miss: 7 of 52 risky pass</text>
</svg>
