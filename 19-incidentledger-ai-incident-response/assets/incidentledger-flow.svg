<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">IncidentLedger: one AI incident moving from a ticket to a rubric rating, running notification clocks and tracked follow-ups</title>
  <desc id="desc">Five-stage flow showing how a filed ticket is classified and rated by a severity rubric, how a clock engine counts the hours to each notification deadline from the determination time, how follow-up actions and related tickets are tracked, and how the incident manager acts before a deadline passes. A comparison strip contrasts the ticket queue with IncidentLedger on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">IncidentLedger - one AI incident, from ticket to deadline</text>
  <text x="20" y="52" class="subheader">Rate it by rubric, start the clocks at determination and count down the hours.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="290" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: a person files an incident ticket</text>

  <!-- Stage 1: TICKET -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . TICKET FILED</text>
  <text x="32" y="162" class="stage-title">Reporter files it</text>
  <text x="32" y="180" class="stage-sub">priority picked by</text>
  <text x="32" y="195" class="stage-sub">the reporter and a</text>
  <text x="32" y="210" class="stage-sub">free text label</text>
  <text x="32" y="223" class="meta-text">120 tickets, 81 labels</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: RATE + CLASSIFY -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . RATE + CLASSIFY</text>
  <text x="237" y="162" class="stage-title">Rubric and category</text>
  <text x="237" y="180" class="stage-sub">five fields to S1-S4</text>
  <text x="237" y="195" class="stage-sub">fields first, then</text>
  <text x="237" y="210" class="stage-sub">keywords, 7 classes</text>
  <text x="237" y="225" class="meta-strong">110 of 120 category right</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: CLOCKS -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . RUN THE CLOCKS</text>
  <text x="467" y="162" class="stage-title">Count the hours</text>
  <text x="467" y="180" class="stage-sub">policy hours from the</text>
  <text x="467" y="195" class="stage-sub">determination time</text>
  <text x="467" y="210" class="stage-sub">left or breached</text>
  <text x="467" y="225" class="meta-strong">39 of 39 missed flagged</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: TRACK + LINK -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . TRACK + LINK</text>
  <text x="717" y="162" class="stage-title">Follow-ups, links</text>
  <text x="717" y="180" class="stage-sub">evidence at closure</text>
  <text x="717" y="195" class="stage-sub">overdue actions</text>
  <text x="717" y="210" class="stage-sub">same root cause</text>
  <text x="717" y="225" class="meta-block">84 of 200 actions flagged</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: ACT -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . ACT BEFORE THE DEADLINE</text>
  <text x="252" y="330" class="stage-title">Incident manager notifies</text>
  <text x="252" y="352" class="stage-sub">countdown . evidence . record</text>
  <text x="252" y="368" class="meta-block">6 clocks running now, with hours left</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: NOTICE SENT -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">notice sent</text>
  <text x="32" y="423" class="stage-sub">inside the window</text>
  <text x="32" y="436" class="meta-strong">no silent miss</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same quarter, two worlds</text>
  <text x="612" y="332" class="timer">Queue: 39 of 87 missed, 0 shown</text>
  <text x="612" y="350" class="timer-fast">IncidentLedger: 39 flagged, 8 unstarted</text>
  <text x="612" y="370" class="meta-strong">known limit: determination is human</text>
</svg>
