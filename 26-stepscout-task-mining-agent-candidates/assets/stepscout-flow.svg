<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">StepScout: three sources merged into step-level touch time, a call per step, a control screen, a ranked list and a build brief</title>
  <desc id="desc">Five-stage flow showing how the interview map, the case-system log and desktop events are merged into step occurrences with touch time, how each step is classified from observable features, how a control screen and a ranking by modeled hours at stake produce a candidate list, and how a build brief is written for an engineer. A comparison strip contrasts the volume-first list with the StepScout list on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">StepScout - find the steps an agent can take over</text>
  <text x="20" y="52" class="subheader">Touch time and observable features decide the call. Waiting time and volume do not.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="300" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: a workflow step with enough touch time</text>

  <!-- Stage 1: SOURCES -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . SOURCES</text>
  <text x="32" y="162" class="stage-title">Three sources</text>
  <text x="32" y="180" class="stage-sub">interview map</text>
  <text x="32" y="195" class="stage-sub">case-system log</text>
  <text x="32" y="210" class="stage-sub">desktop events</text>
  <text x="32" y="223" class="meta-text">53,584 events</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: MERGE -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . MERGE</text>
  <text x="237" y="162" class="stage-title">Merge into steps</text>
  <text x="237" y="180" class="stage-sub">labeled events to</text>
  <text x="237" y="195" class="stage-sub">step occurrences</text>
  <text x="237" y="210" class="stage-sub">touch time, wait</text>
  <text x="237" y="225" class="meta-strong">20,904 occurrences</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: CLASSIFY -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-gate"/>
  <text x="467" y="140" class="stage-num">3 . CLASSIFY</text>
  <text x="467" y="162" class="stage-title">Call each step</text>
  <text x="467" y="180" class="stage-sub">observable features</text>
  <text x="467" y="195" class="stage-sub">never the answer key</text>
  <text x="467" y="210" class="stage-sub">register: control flags</text>
  <text x="467" y="225" class="meta-block">13 of 16 match the key</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: SCREEN AND RANK -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-ship"/>
  <text x="717" y="140" class="stage-num">4 . SCREEN, RANK</text>
  <text x="717" y="162" class="stage-title">Screen and rank</text>
  <text x="717" y="180" class="stage-sub">four-eyes steps out</text>
  <text x="717" y="195" class="stage-sub">hours at stake x</text>
  <text x="717" y="210" class="stage-sub">readiness</text>
  <text x="717" y="225" class="meta-strong">9 of 10 agent-ready</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: BRIEF -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . BUILD BRIEF</text>
  <text x="252" y="330" class="stage-title">Hand off a build brief</text>
  <text x="252" y="352" class="stage-sub">scope, tools, controls, tests, estimate</text>
  <text x="252" y="368" class="meta-block">3 briefs written, all pass the schema check</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: ENGINEER -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">engineer builds</text>
  <text x="32" y="423" class="stage-sub">controls attached</text>
  <text x="32" y="436" class="meta-strong">hours are modeled</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same steps, two lists</text>
  <text x="612" y="332" class="timer">Volume-first: 6 of 10 agent-ready</text>
  <text x="612" y="350" class="timer-fast">StepScout: 9 of 10 agent-ready</text>
  <text x="612" y="370" class="meta-strong">known miss: S14 hides a phone call</text>
</svg>
