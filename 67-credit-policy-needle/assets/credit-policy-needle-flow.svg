<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Credit Policy Needle: a policy manual audited for exception clauses and an assistant's answers scored by form, length and depth, ending in PASS or FAIL</title>
  <desc id="desc">Five-stage flow showing how a policy manual, a probe file and an answers file move through a load and validate step, an audit that lists the clauses reading as exceptions, an exact-match score of each answer, a grouping of results into cells of form, manual length and depth, and the floors that the overall pass rate and each slice must hold, ending in PASS or FAIL that sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts a plain-rule question set, exception questions with the exception beside the rule, and the audit with the gate on 210 synthetic questions and three stub readers with planted faults.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Credit Policy Needle - audit the manual, score the answers, gate the cells</text>
  <text x="20" y="52" class="subheader">Four stub readers carry planted faults. The gate must fail the three faulty ones and pass the control.</text>
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 3 manuals, 210 questions, 4 readers</text>

  <!-- Stage 1 -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">manual text</text>
  <text x="30" y="176" class="stage-sub">probes and answers</text>
  <text x="30" y="190" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>
  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . AUDIT</text>
  <text x="209" y="142" class="stage-title">Which clauses?</text>
  <text x="209" y="162" class="stage-sub">cue word plus a limit</text>
  <text x="209" y="176" class="stage-sub">or a clause reference</text>
  <text x="209" y="190" class="stage-sub">flags an exception</text>
  <text x="209" y="206" class="meta-strong">90 of 105 listed</text>
  <text x="209" y="220" class="meta-block">15 missed, 12 false</text>
  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . SCORE</text>
  <text x="388" y="142" class="stage-title">Exact answer?</text>
  <text x="388" y="162" class="stage-sub">normalized text must</text>
  <text x="388" y="176" class="stage-sub">equal the expected</text>
  <text x="388" y="190" class="stage-sub">answer</text>
  <text x="388" y="206" class="meta-strong">210 questions</text>
  <text x="388" y="220" class="meta-strong">4 readers</text>
  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . CELLS</text>
  <text x="567" y="142" class="stage-title">Which cells?</text>
  <text x="567" y="162" class="stage-sub">form, length and depth:</text>
  <text x="567" y="176" class="stage-sub">a cell under the</text>
  <text x="567" y="190" class="stage-sub">floor is flagged</text>
  <text x="567" y="206" class="meta-strong">84 of 84 as predicted</text>
  <text x="567" y="220" class="meta-strong">0 other flags</text>
  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . FLOORS</text>
  <text x="746" y="142" class="stage-title">Floors held?</text>
  <text x="746" y="162" class="stage-sub">overall pass, each</text>
  <text x="746" y="176" class="stage-sub">form and length slice,</text>
  <text x="746" y="190" class="stage-sub">each depth band</text>
  <text x="746" y="206" class="meta-strong">control: 210 of 210</text>
  <text x="746" y="220" class="meta-block">3 faulty: all fail</text>

  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . GATE</text>
  <text x="262" y="313" class="stage-title">PASS . FAIL</text>
  <text x="262" y="330" class="stage-sub">flagged cells and reasons - exit 1 on FAIL, 2 on bad input</text>
  <text x="262" y="344" class="meta-strong">3 of 3 faulty readers fail, the control passes</text>
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">RUN</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails when the gate fails</text>
  <text x="32" y="344" class="stage-sub">exit 2 on bad input</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">assistant harness</text>
  <text x="742" y="328" class="stage-sub">sweep record</text>
  <text x="742" y="343" class="stage-sub">telemetry</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Plain-rule question set</text>
  <text x="32" y="406" class="meta-block">catches 1 of 3 faulty readers</text>
  <text x="32" y="424" class="stage-sub">30 questions, 0 of 105 exceptions touched</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Exception beside the rule</text>
  <text x="332" y="406" class="meta-block">flags 2 of 3 faulty readers</text>
  <text x="332" y="424" class="stage-sub">12 questions at depth 50%</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Audit and gate</text>
  <text x="632" y="406" class="meta-strong">fails 3 of 3, control passes</text>
  <text x="632" y="424" class="stage-sub">known miss: 15 restated limits unlisted</text>
</svg>
