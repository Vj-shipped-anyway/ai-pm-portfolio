<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">TPRM Gap Map: vendors tiered by the proposed text examples and by four AI characteristics, then tested against an incident log</title>
  <desc id="desc">Five-stage flow showing how a vendor file and an incident log move through a load step, a tiering by the service types the proposed text names, an upstream concentration check, four added AI characteristics and a test of each tier against the incident log, ending in a HIGH or LOWER tier per vendor and a table of how each characteristic performed. A dashed box marks the pieces that are design only. A comparison strip contrasts the due-diligence questionnaire alone, the text examples and the four added characteristics on 60 synthetic vendors.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">TPRM Gap Map - what the text prompts for, and what it leaves out</text>
  <text x="20" y="52" class="subheader">Tier vendors two ways, then test each added marker against the incident log.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="380" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 60 vendors, 100 incidents over 36 months</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">60 vendors</text>
  <text x="30" y="177" class="stage-sub">100 incidents</text>
  <text x="30" y="192" class="stage-sub">bad number: exit 2</text>
  <text x="30" y="212" class="meta-strong">22 are AI-enabled</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: TEXT EXAMPLES -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="209" y="120" class="stage-num">2 . TEXT EXAMPLES</text>
  <text x="209" y="142" class="stage-title">Named service?</text>
  <text x="209" y="162" class="stage-sub">core, cloud, fintech,</text>
  <text x="209" y="177" class="stage-sub">compliance tool, or</text>
  <text x="209" y="192" class="stage-sub">30% of activity: HIGH</text>
  <text x="209" y="212" class="meta-block">30 of 60 marked HIGH</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: CONCENTRATION -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . CONCENTRATION</text>
  <text x="388" y="142" class="stage-title">Shared provider?</text>
  <text x="388" y="162" class="stage-sub">share of activity on</text>
  <text x="388" y="177" class="stage-sub">one upstream model</text>
  <text x="388" y="192" class="stage-sub">provider</text>
  <text x="388" y="212" class="meta-block">P1 carries 61.6%</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: AI MARKERS -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . AI MARKERS</text>
  <text x="567" y="142" class="stage-title">Four markers</text>
  <text x="567" y="162" class="stage-sub">concentration, notice,</text>
  <text x="567" y="177" class="stage-sub">training, retention:</text>
  <text x="567" y="192" class="stage-sub">any one gives HIGH</text>
  <text x="567" y="212" class="meta-strong">41 of 60 marked HIGH</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: TEST -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="746" y="120" class="stage-num">5 . TEST</text>
  <text x="746" y="142" class="stage-title">Score on the log</text>
  <text x="746" y="162" class="stage-sub">caught, missed and</text>
  <text x="746" y="177" class="stage-sub">false alarms, per</text>
  <text x="746" y="192" class="stage-sub">marker and in total</text>
  <text x="746" y="212" class="meta-strong">22 of 24 caught</text>

  <!-- Arrow from stage 5 down to the output -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . OUTPUT</text>
  <text x="262" y="313" class="stage-title">HIGH or LOWER per vendor</text>
  <text x="262" y="330" class="stage-sub">plus vendors with each marker and how many had an incident</text>
  <text x="262" y="344" class="meta-strong">text examples 17 of 24 caught, with markers 22 of 24</text>

  <!-- Review box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">REVIEW</text>
  <text x="32" y="313" class="stage-title">Review queue</text>
  <text x="32" y="330" class="stage-sub">a person reads HIGH</text>
  <text x="32" y="344" class="stage-sub">41 of 60, not 30</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">inventory feed</text>
  <text x="742" y="328" class="stage-sub">incident feed</text>
  <text x="742" y="343" class="stage-sub">tiering ledger</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Questionnaire only</text>
  <text x="32" y="406" class="meta-block">passes 36 of 60 vendors</text>
  <text x="32" y="424" class="stage-sub">16 of those passes had an incident</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Text examples</text>
  <text x="332" y="406" class="meta-block">17 of 24 caught, 13 false alarms</text>
  <text x="332" y="424" class="stage-sub">all 7 misses are AI-enabled</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Four markers added</text>
  <text x="632" y="406" class="meta-strong">22 of 24 caught, 19 false alarms</text>
  <text x="632" y="424" class="stage-sub">known miss: 2 of 24 stay LOWER</text>
</svg>
