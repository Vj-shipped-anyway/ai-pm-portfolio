<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">ISO 20022 Map Check: a legacy-to-ISO mapping and the converter output, checked before release, ending in one PASS or FAIL decision</title>
  <desc id="desc">Six-stage flow showing how a field mapping and pairs of legacy and ISO messages move through a probe step that prints boundary messages, a load and validate step, a mapping check, a pair check and a coverage report, ending in one PASS or FAIL decision that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts schema validation alone, an exact field comparison and Map Check on 230 synthetic message pairs from 10 converter builds.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Map Check - the mapping and the converter output, checked before release</text>
  <text x="20" y="52" class="subheader">Mapping checks and pair checks share one decision. Any error fails the step.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 10 builds, 23 messages each, 230 pairs</text>

  <!-- Stage 1: PROBE -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . PROBE</text>
  <text x="30" y="142" class="stage-title">Boundary messages</text>
  <text x="30" y="162" class="stage-sub">every field at its</text>
  <text x="30" y="177" class="stage-sub">limit, then run them</text>
  <text x="30" y="192" class="stage-sub">through the converter</text>
  <text x="30" y="212" class="meta-strong">probes alone: 6 of 8</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: LOAD -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="209" y="120" class="stage-num">2 . LOAD</text>
  <text x="209" y="142" class="stage-title">Read the files</text>
  <text x="209" y="162" class="stage-sub">mapping and pairs</text>
  <text x="209" y="177" class="stage-sub">bad input: exit 2</text>
  <text x="209" y="212" class="meta-strong">never a silent pass</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: MAPPING -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . MAPPING</text>
  <text x="388" y="142" class="stage-title">Mapping alone</text>
  <text x="388" y="162" class="stage-sub">no row, unsourced,</text>
  <text x="388" y="177" class="stage-sub">no code entry, no fit</text>
  <text x="388" y="212" class="meta-strong">5 of 5 defects found</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: PAIRS -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . PAIRS</text>
  <text x="567" y="142" class="stage-title">Each pair</text>
  <text x="567" y="162" class="stage-sub">rebuild the ISO value</text>
  <text x="567" y="177" class="stage-sub">dropped, cut, changed</text>
  <text x="567" y="192" class="stage-sub">or no source</text>
  <text x="567" y="212" class="meta-strong">212 of 212 found</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: COVERAGE -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . COVERAGE</text>
  <text x="746" y="142" class="stage-title">What was not hit</text>
  <text x="746" y="162" class="stage-sub">code values and</text>
  <text x="746" y="177" class="stage-sub">combinations no</text>
  <text x="746" y="192" class="stage-sub">message reached</text>
  <text x="746" y="212" class="meta-block">2 of 9 combos unseen</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">PASS . FAIL</text>
  <text x="262" y="330" class="stage-sub">any error exits 1, bad input exits 2, no value is printed</text>
  <text x="262" y="344" class="meta-strong">5 of 5 and 212 of 212 found, 0 of 162 harmless flagged</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on any error</text>
  <text x="32" y="344" class="stage-sub">names, counts, no values</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">mapping registry</text>
  <text x="742" y="328" class="stage-sub">converter test job</text>
  <text x="742" y="343" class="stage-sub">decision ledger</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Schema validation only</text>
  <text x="32" y="406" class="meta-block">113 of 129 defective pairs pass</text>
  <text x="32" y="424" class="stage-sub">only 1 of 8 defective builds fails</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Exact comparison</text>
  <text x="332" y="406" class="meta-block">78 of 129 defective pairs caught</text>
  <text x="332" y="424" class="stage-sub">154 of 162 harmless flagged</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Map Check, all parts</text>
  <text x="632" y="406" class="meta-strong">212 of 212 found, 0 of 162 flagged</text>
  <text x="632" y="424" class="stage-sub">known miss: build B10</text>
</svg>
