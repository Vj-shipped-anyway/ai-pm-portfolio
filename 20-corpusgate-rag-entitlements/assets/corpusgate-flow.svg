<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">CorpusGate: a question flowing through ACL sync, effective access, an ingestion scan and a pre-filter before ranking</title>
  <desc id="desc">Four-stage flow showing how source access lists and the group tree are synced, resolved into effective access for the asking user, combined with a personal-data scan at ingestion, and applied as a filter before the top results are chosen. A canary pack tests the result. A comparison strip contrasts retrieval with no access check against CorpusGate on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">CorpusGate - an entitlement check before the top results are chosen</text>
  <text x="20" y="52" class="subheader">The assistant asks for documents. CorpusGate works out who may read what, then ranks only those.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="250" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: a user asks the assistant a question</text>

  <!-- Stage 1: SYNC ACLS -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . SYNC ACLS</text>
  <text x="32" y="162" class="stage-title">Read source ACLs</text>
  <text x="32" y="180" class="stage-sub">groups and denies</text>
  <text x="32" y="195" class="stage-sub">change log</text>
  <text x="32" y="210" class="stage-sub">a sync, not live</text>
  <text x="32" y="223" class="meta-text">36 of 500 copies stale</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: RESOLVE -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . RESOLVE</text>
  <text x="237" y="162" class="stage-title">Effective access</text>
  <text x="237" y="180" class="stage-sub">nested groups</text>
  <text x="237" y="195" class="stage-sub">explicit denies</text>
  <text x="237" y="210" class="stage-sub">user x document</text>
  <text x="237" y="225" class="meta-strong">20,000 of 20,000 agree</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: INGEST SCAN -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . INGEST SCAN</text>
  <text x="467" y="162" class="stage-title">Hold or mask PII</text>
  <text x="467" y="180" class="stage-sub">regex, not a model</text>
  <text x="467" y="195" class="stage-sub">hold SSN and account</text>
  <text x="467" y="210" class="stage-sub">mask e-mail</text>
  <text x="467" y="225" class="meta-strong">50 of 60 found</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: FILTER THEN RANK -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . FILTER, THEN RANK</text>
  <text x="717" y="162" class="stage-title">Pre-filter</text>
  <text x="717" y="180" class="stage-sub">stub TF-IDF scorer</text>
  <text x="717" y="195" class="stage-sub">unreadable docs out</text>
  <text x="717" y="210" class="stage-sub">before the top 5</text>
  <text x="717" y="225" class="meta-block">291 leaks cut to 11</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: CANARIES -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . CANARY PACK, RUN ON A SCHEDULE</text>
  <text x="252" y="330" class="stage-title">Pairs that must come back empty</text>
  <text x="252" y="352" class="stage-sub">120 user and document pairs</text>
  <text x="252" y="368" class="meta-block">7 of 120 leak: the sync window</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: ASSISTANT -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">assistant answers</text>
  <text x="32" y="423" class="stage-sub">from readable docs</text>
  <text x="32" y="436" class="meta-strong">11 of 1,000 leak</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same 200 questions, two worlds</text>
  <text x="612" y="332" class="timer">No check: 291 of 1,000 leak</text>
  <text x="612" y="350" class="timer-fast">CorpusGate: 11 of 1,000 leak</text>
  <text x="612" y="370" class="meta-strong">known limit: 10 PII docs missed</text>
</svg>
