<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Memo Tieout: every figure in a credit memo tied to a spread line or a recomputed ratio at the decimals the memo shows, ending in PASS, FAIL or NOTHING CHECKED</title>
  <desc id="desc">Five-stage flow showing how a markdown credit memo and a spread CSV move through a read and validate step, a scan that finds figures and marks, a resolution of each mark to a spread line or a recomputed ratio, a tie that compares the figure with the spread value rounded to the shown decimals, and a rule that a figure with no mark is untied. The result is PASS, FAIL or NOTHING CHECKED, which sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts no check, a script that looks for each figure among the spread values, and Memo Tieout on 28 synthetic memos and 308 planted figures.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Memo Tieout - every figure in a credit memo, tied to the spread</text>
  <text x="20" y="52" class="subheader">A figure ties only when the spread value, rounded to the shown decimals, equals it. No tolerance.</text>

  <rect x="20" y="66" width="372" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 28 memos, 308 planted figures, 124 of them wrong</text>

  <rect x="20" y="100" width="161" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . READ</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">memo and spread CSV</text>
  <text x="30" y="177" class="stage-sub">units to dollars</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>
  <line x1="183" y1="166" x2="196" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="199" y="100" width="161" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . SCAN</text>
  <text x="209" y="142" class="stage-title">Find the figures</text>
  <text x="209" y="162" class="stage-sub">dollars, percents, x;</text>
  <text x="209" y="177" class="stage-sub">skip code and URLs</text>
  <text x="209" y="192" class="stage-sub">read each mark</text>
  <text x="209" y="212" class="meta-strong">308 planted figures</text>
  <line x1="362" y1="166" x2="375" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="378" y="100" width="161" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . RESOLVE</text>
  <text x="388" y="142" class="stage-title">Line or formula</text>
  <text x="388" y="162" class="stage-sub">a spread line, or a</text>
  <text x="388" y="177" class="stage-sub">formula for margins</text>
  <text x="388" y="192" class="stage-sub">and ratios</text>
  <text x="388" y="212" class="meta-strong">stale ratio: 10 of 10</text>
  <line x1="541" y1="166" x2="554" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="557" y="100" width="161" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . TIE</text>
  <text x="567" y="142" class="stage-title">Equal as shown</text>
  <text x="567" y="162" class="stage-sub">round half away from</text>
  <text x="567" y="177" class="stage-sub">zero to the decimals</text>
  <text x="567" y="192" class="stage-sub">shown, no tolerance</text>
  <text x="567" y="212" class="meta-strong">typos: 14 of 14</text>
  <line x1="720" y1="166" x2="733" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="736" y="100" width="161" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . UNMARKED</text>
  <text x="746" y="142" class="stage-title">No mark, no pass</text>
  <text x="746" y="162" class="stage-sub">a figure with no mark</text>
  <text x="746" y="177" class="stage-sub">is untied, a term is</text>
  <text x="746" y="192" class="stage-sub">set aside</text>
  <text x="746" y="212" class="meta-block">12 of 184 flagged</text>

  <path d="M 816 232 L 816 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . RESULT</text>
  <text x="262" y="313" class="stage-title">PASS . FAIL . NOTHING CHECKED</text>
  <text x="262" y="330" class="stage-sub">exit 1 on a flagged figure or nothing checked, bad input 2</text>
  <text x="262" y="344" class="meta-strong">104 of 124 wrong caught, 12 of 184 fine flagged</text>
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">REVIEWER</text>
  <text x="32" y="313" class="stage-title">Opens flagged figures</text>
  <text x="32" y="330" class="stage-sub">116 of 308 opened</text>
  <text x="32" y="344" class="stage-sub">104 of 116 are real</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">memo and spread feed</text>
  <text x="742" y="328" class="stage-sub">check record</text>
  <text x="742" y="343" class="stage-sub">reviewed formulas</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No check</text>
  <text x="32" y="406" class="meta-block">0 of 124 wrong stopped</text>
  <text x="32" y="424" class="stage-sub">reviewer looks up all 308 figures</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Value anywhere in spread</text>
  <text x="332" y="406" class="meta-block">98 of 124 caught, 107 of 184 false</text>
  <text x="332" y="424" class="stage-sub">every percent and multiple flagged</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Memo Tieout</text>
  <text x="632" y="406" class="meta-strong">104 of 124 caught, 12 of 184 false</text>
  <text x="632" y="424" class="stage-sub">known limit: 20 wrong figures pass</text>
</svg>
