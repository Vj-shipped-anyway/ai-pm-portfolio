<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">EvalForge: prompt change flowing through probe run, judge scoring, CI gate verdict, and deploy decision</title>
  <desc id="desc">Five-stage horizontal flow showing how a prompt change moves through Probe Set Runs, Judge plus Rubric Scores, CI Gate Verdict, and either Deploy or Block. Each stage has a one-line description and a dwell time annotation showing the speedup vs the legacy spreadsheet eval process.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #5bc0be; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">EvalForge - CI gate flow for one prompt change</text>
  <text x="20" y="52" class="subheader">Vendor snapshot rolls 2026-02-14. Pass rate drops 5pp. CI gate blocks deploy on first run.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="200" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: PR merged or vendor snapshot change</text>

  <!-- Stage 1: PROMPT CHANGE -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . PROMPT CHANGE</text>
  <text x="32" y="162" class="stage-title">PR merged / snapshot rolls</text>
  <text x="32" y="180" class="stage-sub">prompt edit or vendor</text>
  <text x="32" y="195" class="stage-sub">model update</text>
  <text x="32" y="218" class="meta-text">+ probe-set diff committed</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: PROBE SET RUNS -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . PROBE SET RUNS</text>
  <text x="237" y="162" class="stage-title">60 versioned probes</text>
  <text x="237" y="180" class="stage-sub">probes-v1.2 pinned</text>
  <text x="237" y="195" class="stage-sub">6 deficiency classes</text>
  <text x="237" y="210" class="stage-sub">15 behavioral slices</text>
  <text x="237" y="225" class="meta-strong">~3 min wall time on prototype</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: JUDGE + RUBRIC -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . JUDGE + RUBRIC SCORES</text>
  <text x="467" y="162" class="stage-title">Cross-vendor LLM-as-judge</text>
  <text x="467" y="180" class="stage-sub">Claude + GPT-4o judges</text>
  <text x="467" y="195" class="stage-sub">12 calibrated rubrics</text>
  <text x="467" y="210" class="stage-sub">inter-judge kappa = 0.68</text>
  <text x="467" y="225" class="meta-block">kappa collapsed below 0.75</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: CI GATE -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . CI GATE VERDICT</text>
  <text x="717" y="162" class="stage-title">Pre-deploy hook</text>
  <text x="717" y="180" class="stage-sub">pass_rate = 0.86</text>
  <text x="717" y="195" class="stage-sub">delta vs baseline = -5pp</text>
  <text x="717" y="210" class="stage-sub">kappa = 0.68 (below floor)</text>
  <text x="717" y="225" class="meta-block">verdict: FAIL</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 360 256 L 360 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: DEPLOY OR BLOCK -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . BLOCK DEPLOY</text>
  <text x="252" y="330" class="stage-title">Pin to last green snapshot; route to L2 trust-and-safety</text>
  <text x="252" y="352" class="stage-sub">never auto-ship under FAIL . always human review</text>
  <text x="252" y="368" class="meta-block">evidence bundle auto-assembled, routed to L2 queue</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: ROLLBACK -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box"/>
  <text x="32" y="405" class="stage-title">deploy pipeline</text>
  <text x="32" y="423" class="stage-sub">rolled back to last green</text>
  <text x="32" y="436" class="meta-strong">no customer impact</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="280" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Total wall time vs spreadsheet eval</text>
  <text x="612" y="332" class="timer">Spreadsheet eval: ~14% silent-regression rate, 8-12 weeks to detect</text>
  <text x="612" y="350" class="timer-fast">EvalForge: caught on first run, deploy blocked, 0 customer impact</text>
  <text x="612" y="370" class="meta-strong">modeled regression rate &lt;2% post-deploy at fleet scale</text>
</svg>
