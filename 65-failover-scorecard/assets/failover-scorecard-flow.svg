<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Failover Scorecard: one service map and one drill log, checked in order, ending in one status per service and a tier-1 decision</title>
  <desc id="desc">Five-stage flow showing how a service map and a drill log move through a load and validate step, a check that the service has a second region and a live drill of the right scenario, a check that the latest drill passed inside the recovery target, a check that it ran on the current region and config version inside the window for the tier, and a check that every declared dependency is itself ready. The result is one status and one reason per service and a READY or NOT READY decision for tier 1 that sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts an owner's stated plan, a green mark when the latest drill passed, and the scorecard on 48 synthetic services.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Failover Scorecard - one service map and drill log, one status each</text>
  <text x="20" y="52" class="subheader">Red figure on a stage: of the 28 services that would not recover, how many pass if that check is cut.</text>
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 48 services, 54 drill rows</text>

  <!-- Stage 1 -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">service map</text>
  <text x="30" y="176" class="stage-sub">drill log</text>
  <text x="30" y="190" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>
  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="209" y="120" class="stage-num">2 . PATH AND DRILL</text>
  <text x="209" y="142" class="stage-title">Live drill?</text>
  <text x="209" y="162" class="stage-sub">needs a live drill</text>
  <text x="209" y="176" class="stage-sub">tabletop does not</text>
  <text x="209" y="190" class="stage-sub">count: UNTESTED</text>
  <text x="209" y="212" class="meta-block">5 of 28 slip through</text>
  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . PASS AND SPEED</text>
  <text x="388" y="142" class="stage-title">Passed in time?</text>
  <text x="388" y="162" class="stage-sub">latest live drill</text>
  <text x="388" y="176" class="stage-sub">failed: FAILED</text>
  <text x="388" y="190" class="stage-sub">over target: SLOW</text>
  <text x="388" y="212" class="meta-block">5 of 28 slip through</text>
  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . REGION AND AGE</text>
  <text x="567" y="142" class="stage-title">Still current?</text>
  <text x="567" y="162" class="stage-sub">ran on today's region</text>
  <text x="567" y="176" class="stage-sub">and config, inside the</text>
  <text x="567" y="190" class="stage-sub">window for its tier</text>
  <text x="567" y="206" class="meta-block">8 of 28 slip: region</text>
  <text x="567" y="220" class="meta-block">6 of 28 slip: window</text>
  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . DEPENDENCIES</text>
  <text x="746" y="142" class="stage-title">Dependencies</text>
  <text x="746" y="162" class="stage-sub">every declared</text>
  <text x="746" y="176" class="stage-sub">dependency must be</text>
  <text x="746" y="190" class="stage-sub">READY, else DEPENDENCY</text>
  <text x="746" y="212" class="meta-block">6 of 28 slip through</text>

  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">READY . NOT READY (tier 1)</text>
  <text x="262" y="330" class="stage-sub">one status and one reason per service, exit 1 on a tier-1 gap</text>
  <text x="262" y="344" class="meta-strong">25 of 28 flagged, 0 of 16 ready flagged</text>
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">RUN</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on a tier-1 gap</text>
  <text x="32" y="344" class="stage-sub">exit 2 on bad input</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">scheduled feed sync</text>
  <text x="742" y="328" class="stage-sub">scorecard record</text>
  <text x="742" y="343" class="stage-sub">telemetry</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Owner says there is a plan</text>
  <text x="32" y="406" class="meta-block">16 of 42 would recover</text>
  <text x="32" y="424" class="stage-sub">42 of 48 services state a plan</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Latest drill passed means green</text>
  <text x="332" y="406" class="meta-block">20 of 36 green would not recover</text>
  <text x="332" y="424" class="stage-sub">36 of 48 services show green</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Failover Scorecard, one rule</text>
  <text x="632" y="406" class="meta-strong">25 of 28 flagged, 0 of 16 ready flagged</text>
  <text x="632" y="424" class="stage-sub">known miss: 3 pass, undeclared edge</text>
</svg>
