<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">SchemaWatch: a tool-schema change flowing through diff, replay, ranking and the release gate</title>
  <desc id="desc">Five-stage flow showing how a tool owner's schema change moves through a structural diff and description heuristic, a replay of recorded agent calls, a blast-radius ranking and a release gate that returns BLOCK, REVIEW or ALLOW. A comparison strip contrasts nothing watching with SchemaWatch on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">SchemaWatch - release gate for one tool-schema change</text>
  <text x="20" y="52" class="subheader">The owner ships a change. SchemaWatch diffs it, replays recorded calls and decides before the agent hits it.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="250" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: new schema revision published</text>

  <!-- Stage 1: SCHEMA RELEASE -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . SCHEMA RELEASE</text>
  <text x="32" y="162" class="stage-title">Owner ships it</text>
  <text x="32" y="180" class="stage-sub">tool schema v1-&gt;v2</text>
  <text x="32" y="195" class="stage-sub">version bumped or</text>
  <text x="32" y="210" class="stage-sub">not: both happen</text>
  <text x="32" y="223" class="meta-text">9 of 25 unbumped</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: DIFF + HEURISTIC -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . DIFF + HEURISTIC</text>
  <text x="237" y="162" class="stage-title">Classify changes</text>
  <text x="237" y="180" class="stage-sub">types enums defaults</text>
  <text x="237" y="195" class="stage-sub">numbers + units text</text>
  <text x="237" y="210" class="stage-sub">3 classes, with reason</text>
  <text x="237" y="225" class="meta-strong">41 of 45 match the ledger</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: REPLAY -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . REPLAY</text>
  <text x="467" y="162" class="stage-title">Replay recorded calls</text>
  <text x="467" y="180" class="stage-sub">strict validator, stdlib</text>
  <text x="467" y="195" class="stage-sub">2,500 calls vs new schema</text>
  <text x="467" y="210" class="stage-sub">would-break count per tool</text>
  <text x="467" y="225" class="meta-strong">742 predicted, 742 true</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: RANK + GATE -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . RANK + GATE</text>
  <text x="717" y="162" class="stage-title">Decide at release</text>
  <text x="717" y="180" class="stage-sub">rank by calls hit</text>
  <text x="717" y="195" class="stage-sub">BLOCK REVIEW ALLOW</text>
  <text x="717" y="210" class="stage-sub">reason on every row</text>
  <text x="717" y="225" class="meta-block">17 block 6 review 8 allow</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: ACT -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . ACT BEFORE THE AGENT HITS IT</text>
  <text x="252" y="330" class="stage-title">Owner and agent team fix first</text>
  <text x="252" y="352" class="stage-sub">BLOCK holds it . REVIEW needs a person</text>
  <text x="252" y="368" class="meta-block">evidence bundle: findings, calls, reason</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: AGENT -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">agent calls</text>
  <text x="32" y="423" class="stage-sub">keep working</text>
  <text x="32" y="436" class="meta-strong">no failed calls</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same changes, two worlds</text>
  <text x="612" y="332" class="timer">Nothing watching: 742 fail, 538 misread</text>
  <text x="612" y="350" class="timer-fast">SchemaWatch: held first, 169 left</text>
  <text x="612" y="370" class="meta-strong">known limit: 3 meaning changes unseen</text>
</svg>
