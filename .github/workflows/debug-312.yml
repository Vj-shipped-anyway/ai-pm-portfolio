name: Debug 3.12 tests (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show the failing tests
        run: |
          for d in 30-payment-mandate-check 32-evidence-gate 34-audit-chain 40-eval-gate 53-feature-contract 58-plant; do
            echo "=== $d"
            (cd "$d" && python -m unittest discover -s tests 2>&1 | grep -A28 -E "^(FAIL|ERROR):" | head -80) || true
          done
