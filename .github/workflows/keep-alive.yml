name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every 3 days at 6 AM UTC (well under Streamlit's 7-day sleep threshold)
    - cron: '0 6 */3 * *'
  workflow_dispatch:  # allows manual "Run workflow" click from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HalluGuard
        run: curl -sSf --max-time 60 https://halluguard-bfsi.streamlit.app || true

      - name: Ping DriftSentinel
        run: curl -sSf --max-time 60 https://driftsentinel-bfsi.streamlit.app || true

      - name: Ping LeaseGuard
        run: curl -sSf --max-time 60 https://leaseguard-cre.streamlit.app || true

      - name: Ping EvalForge
        run: curl -sSf --max-time 60 https://evalforge-bfsi.streamlit.app || true

      - name: Ping AgentWatch
        run: curl -sSf --max-time 60 https://agentwatch-bfsi.streamlit.app || true

      - name: Ping PromptShield
        run: curl -sSf --max-time 60 https://promptshield-bfsi.streamlit.app || true

      - name: Ping InferenceLens
        run: curl -sSf --max-time 60 https://inferencelens-bfsi.streamlit.app || true

      - name: Ping OversightOps
        run: curl -sSf --max-time 60 https://oversightops-bfsi.streamlit.app || true

      - name: Ping LineageLog
        run: curl -sSf --max-time 60 https://lineagelog-bfsi.streamlit.app || true

      - name: Ping DealSentry
        run: curl -sSf --max-time 60 https://dealsentry-cre.streamlit.app || true

      - name: Ping TierGate
        run: curl -sSf --max-time 60 https://tiergate-bfsi.streamlit.app || true

      - name: Ping ValueLedger
        run: curl -sSf --max-time 60 https://valueledger-bfsi.streamlit.app || true

      - name: Ping SwapBrief
        run: curl -sSf --max-time 60 https://swapbrief-bfsi.streamlit.app || true

      - name: Ping PolicyNeedle
        run: curl -sSf --max-time 60 https://policyneedle-bfsi.streamlit.app || true

      - name: Ping SchemaWatch
        run: curl -sSf --max-time 60 https://schemawatch-bfsi.streamlit.app || true

      - name: Log completion
        run: echo "Keep-alive ping completed at $(date -u)"
