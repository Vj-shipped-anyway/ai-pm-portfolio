<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">FairLens: a scored set of credit decisions flowing through AIR by group, a cutoff sweep, a proxy ablation, a reason-code check and a verdict per test</title>
  <desc id="desc">Five-stage flow showing how a set of scored credit decisions with synthetic group labels moves through an adverse impact ratio by group with a bootstrap interval, a cutoff sweep and a proxy ablation, and a reason-code check that returns PASS, REVIEW or FAIL for each of six tests. A comparison strip contrasts the accuracy-only view with the FairLens test pack on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">FairLens - fairness test pack for one credit-decision model</text>
  <text x="20" y="52" class="subheader">The model card shows accuracy. FairLens runs six tests and returns PASS, REVIEW or FAIL for each.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="290" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: a scored decision set with group labels</text>

  <!-- Stage 1: SCORED DECISIONS -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . SCORED DECISIONS</text>
  <text x="32" y="162" class="stage-title">Score applicants</text>
  <text x="32" y="180" class="stage-sub">stub scorecard</text>
  <text x="32" y="195" class="stage-sub">6,000 synthetic</text>
  <text x="32" y="210" class="stage-sub">cutoff 190 points</text>
  <text x="32" y="223" class="meta-text">87.1% accuracy</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: AIR BY GROUP -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . AIR BY GROUP</text>
  <text x="237" y="162" class="stage-title">Approval by group</text>
  <text x="237" y="180" class="stage-sub">AIR = rate / top rate</text>
  <text x="237" y="195" class="stage-sub">95% bootstrap interval</text>
  <text x="237" y="210" class="stage-sub">screen 0.80</text>
  <text x="237" y="225" class="meta-block">lowest AIR 0.750</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: SWEEP + ABLATE -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . SWEEP + ABLATE</text>
  <text x="467" y="162" class="stage-title">Sweep and ablate</text>
  <text x="467" y="180" class="stage-sub">cutoff 120 to 250</text>
  <text x="467" y="195" class="stage-sub">postcode points neutral</text>
  <text x="467" y="210" class="stage-sub">AIR and accuracy re-run</text>
  <text x="467" y="225" class="meta-strong">0.750 to 0.871, proxy off</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: REASONS + VERDICT -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . REASONS + VERDICT</text>
  <text x="717" y="162" class="stage-title">Reasons and verdict</text>
  <text x="717" y="180" class="stage-sub">matched declined pairs</text>
  <text x="717" y="195" class="stage-sub">PASS REVIEW FAIL</text>
  <text x="717" y="210" class="stage-sub">numbers on every row</text>
  <text x="717" y="225" class="meta-block">4 FAIL 1 REVIEW 1 PASS</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: ACT -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . A PERSON READS THE PACK</text>
  <text x="252" y="330" class="stage-title">Model risk decides what happens</text>
  <text x="252" y="352" class="stage-sub">FAIL holds it . REVIEW needs a person</text>
  <text x="252" y="368" class="meta-block">evidence: AIR, interval, sweep, ablation</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: MODEL OWNER -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">model owner</text>
  <text x="32" y="423" class="stage-sub">fixes, then re-runs</text>
  <text x="32" y="436" class="meta-strong">same pack, new run</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same model, two views</text>
  <text x="612" y="332" class="timer">Accuracy only: 87.1%, 0 tests run</text>
  <text x="612" y="350" class="timer-fast">FairLens: 5 of 6 tests flagged</text>
  <text x="612" y="370" class="meta-strong">known limit: labels, one ablation</text>
</svg>
