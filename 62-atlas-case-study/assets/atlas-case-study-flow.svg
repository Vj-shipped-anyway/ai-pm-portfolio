<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS Case Study: the trace of one flagged agent run, turned into a draft case study with call numbers behind each step</title>
  <desc id="desc">Five-stage flow showing how the trace of one flagged agent run moves through a load and validate step, a loop finder, a mapping to three ATLAS techniques, identifier redaction and a lint against the contribution schema rules, ending in a draft case study with the actor, reporter and references left as TODO. A dashed box marks the pieces that are design only. A comparison strip contrasts having no case study, a draft written from the ticket words and the draft from the trace on 60 synthetic flagged runs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">ATLAS Case Study - one flagged run, drafted from its trace</text>
  <text x="20" y="52" class="subheader">Plain rules read the calls. The ticket note is never read. A person fills what the trace cannot show.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 60 flagged runs, 3591 tool calls</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the bundle</text>
  <text x="30" y="162" class="stage-sub">run, calls, id fields</text>
  <text x="30" y="177" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent draft</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: LOOPS -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="209" y="120" class="stage-num">2 . LOOPS</text>
  <text x="209" y="142" class="stage-title">Find the loop</text>
  <text x="209" y="162" class="stage-sub">same tool, same shape</text>
  <text x="209" y="177" class="stage-sub">20 or more calls</text>
  <text x="209" y="192" class="stage-sub">0.9 or more not ok</text>
  <text x="209" y="212" class="meta-block">22 of 32 failures found</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: MAP -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="388" y="120" class="stage-num">3 . MAP</text>
  <text x="388" y="142" class="stage-title">Three techniques</text>
  <text x="388" y="162" class="stage-sub">loop: AML.T0029</text>
  <text x="388" y="177" class="stage-sub">flag: AML.T0051.001</text>
  <text x="388" y="192" class="stage-sub">cost cap: AML.T0034</text>
  <text x="388" y="212" class="meta-strong">22 of 22 sets match</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: REDACT -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . REDACT</text>
  <text x="567" y="142" class="stage-title">Keep names out</text>
  <text x="567" y="162" class="stage-sub">ticket note not read</text>
  <text x="567" y="177" class="stage-sub">declared ids replaced</text>
  <text x="567" y="212" class="meta-strong">0 of 22 drafts leak</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: LINT -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . LINT</text>
  <text x="746" y="142" class="stage-title">Check the draft</text>
  <text x="746" y="162" class="stage-sub">schema rules read</text>
  <text x="746" y="177" class="stage-sub">in the ATLAS files</text>
  <text x="746" y="192" class="stage-sub">plus a leak check</text>
  <text x="746" y="212" class="meta-strong">0 schema problems</text>

  <!-- Arrow from stage 5 down to the output -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DRAFT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DRAFT</text>
  <text x="262" y="313" class="stage-title">Case study, YAML or JSON</text>
  <text x="262" y="330" class="stage-sub">each step cites call numbers, 3 fields left as TODO</text>
  <text x="262" y="344" class="meta-strong">22 of 32 failures drafted, 0 of 28 harmless runs</text>

  <!-- Person box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">A PERSON</text>
  <text x="32" y="313" class="stage-title">Completes and signs</text>
  <text x="32" y="330" class="stage-sub">actor, reporter, references</text>
  <text x="32" y="344" class="stage-sub">decides what is shared</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">trace export</text>
  <text x="742" y="328" class="stage-sub">review and sign-off</text>
  <text x="742" y="343" class="stage-sub">draft record</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No case study</text>
  <text x="32" y="406" class="meta-block">0 of 60 flagged runs written up</text>
  <text x="32" y="424" class="stage-sub">45 of 60 tickets carry an id or name</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Draft from the ticket words</text>
  <text x="332" y="406" class="meta-block">15 of 32 failures, 19 of 28 harmless</text>
  <text x="332" y="424" class="stage-sub">0 of 43 steps point at a call</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Draft from the trace</text>
  <text x="632" y="406" class="meta-strong">22 of 32 failures, 0 of 28 harmless</text>
  <text x="632" y="424" class="stage-sub">known miss: 10 of 32 get no draft</text>
</svg>
