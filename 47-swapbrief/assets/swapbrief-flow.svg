<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">swapbrief: a results file and a price table, judged by intervals, ending in one brief</title>
  <desc id="desc">Five-stage flow showing how a results file and a price table move through a load and pair step, a seeded paired bootstrap, a cost per correct answer and p95 latency check judged at the interval lower bound, a slice by slice check with a critical slice rule, and a rule that lets the worst reason win, ending in one brief of GO, GO WITH GUARDRAILS or NO-GO with rollback triggers. A dashed box marks the pieces that are design only. A comparison strip contrasts the headline average, the average plus the vendor sheet and swapbrief on 80 simulated migrations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">swapbrief - one migration, judged by intervals, one brief before launch</text>
  <text x="20" y="52" class="subheader">Cost, the slow tail and each slice are read beside the average. The worst reason wins.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="400" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 600 paired items, 6 slices, 80 simulated migrations</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD AND PAIR</text>
  <text x="30" y="142" class="stage-title">Read two files</text>
  <text x="30" y="162" class="stage-sub">results and prices</text>
  <text x="30" y="177" class="stage-sub">items paired by id</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">600 paired items</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: INTERVALS -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . INTERVALS</text>
  <text x="209" y="142" class="stage-title">Paired bootstrap</text>
  <text x="209" y="162" class="stage-sub">seeded, so a rerun</text>
  <text x="209" y="177" class="stage-sub">gives the same bounds</text>
  <text x="209" y="212" class="meta-block">1 sample: p95 1.57x-2.80x</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: COST AND TAIL -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . COST AND TAIL</text>
  <text x="388" y="142" class="stage-title">Per correct answer</text>
  <text x="388" y="162" class="stage-sub">cost: block at 1.25x</text>
  <text x="388" y="177" class="stage-sub">p95: block at 1.50x</text>
  <text x="388" y="192" class="stage-sub">at the lower bound</text>
  <text x="388" y="212" class="meta-block">1.36x cost, 1.81x p95</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: SLICES -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . SLICES</text>
  <text x="567" y="142" class="stage-title">Slice by slice</text>
  <text x="567" y="162" class="stage-sub">fall of 5 pp or more</text>
  <text x="567" y="177" class="stage-sub">thin critical slice:</text>
  <text x="567" y="192" class="stage-sub">INCONCLUSIVE</text>
  <text x="567" y="212" class="meta-block">known miss: 4 of 26</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: VERDICT -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . VERDICT</text>
  <text x="746" y="142" class="stage-title">Worst reason wins</text>
  <text x="746" y="162" class="stage-sub">any block: NO-GO</text>
  <text x="746" y="177" class="stage-sub">any guard: guardrails</text>
  <text x="746" y="192" class="stage-sub">none: GO</text>
  <text x="746" y="212" class="meta-strong">2 of 45 false GO</text>

  <!-- Arrow from stage 5 down to the brief -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: BRIEF -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . BRIEF</text>
  <text x="262" y="313" class="stage-title">GO . GO WITH GUARDRAILS . NO-GO</text>
  <text x="262" y="330" class="stage-sub">reasons, and rollback triggers for the launch plan</text>
  <text x="262" y="344" class="meta-strong">0 of 35 good migrations stopped, 19 of 35 get guardrails</text>

  <!-- Launch review box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">LAUNCH REVIEW</text>
  <text x="32" y="313" class="stage-title">Reads the brief</text>
  <text x="32" y="330" class="stage-sub">reasons and intervals</text>
  <text x="32" y="344" class="stage-sub">triggers go in the plan</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">reviewed limits</text>
  <text x="742" y="328" class="stage-sub">brief ledger</text>
  <text x="742" y="343" class="stage-sub">CI step</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Headline average</text>
  <text x="32" y="406" class="meta-block">41 of 45 false GO</text>
  <text x="32" y="424" class="stage-sub">0 rollback triggers written</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Average plus vendor sheet</text>
  <text x="332" y="406" class="meta-block">36 of 45 false GO</text>
  <text x="332" y="424" class="stage-sub">list price 0.85x, median 0.96x</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">swapbrief</text>
  <text x="632" y="406" class="meta-strong">2 of 45 false GO</text>
  <text x="632" y="424" class="stage-sub">NO-GO on the committed set</text>
</svg>
