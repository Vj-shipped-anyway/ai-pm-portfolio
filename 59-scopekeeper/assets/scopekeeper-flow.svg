<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">scopekeeper: grants compared with calls, a smaller grant set proposed, and the proposal replayed against the same calls</title>
  <desc id="desc">Five-stage flow showing how a grant list, a call log, an optional scope catalog and an optional agents file are loaded and validated, how calls are counted for each agent with untagged calls credited to every agent on the service account that holds the scope, how each grant is proposed for removal or narrowing, how the smaller grant set is replayed against the same calls to count newly denied calls, and how a report and an exit code come out. The tool proposes and never applies a change. A dashed box marks the pieces that are design only. A comparison strip contrasts the annual review, a log-count report that reads only tagged calls, and the usage-versus-grant diff on one synthetic estate.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">scopekeeper - what an agent may do against what it did</text>
  <text x="20" y="52" class="subheader">Compare grants with calls, propose a smaller set, replay it. Nothing is applied.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="420" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 167 grants and 5210 calls over 90 days</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="140" class="stage-title">Read the files</text>
  <text x="30" y="158" class="stage-sub">grants and call log</text>
  <text x="30" y="172" class="stage-sub">catalog, agents file</text>
  <text x="30" y="186" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="200" class="stage-sub">empty log: refused</text>
  <text x="30" y="220" class="meta-strong">refuses to guess</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: USAGE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . USAGE</text>
  <text x="209" y="140" class="stage-title">Count the calls</text>
  <text x="209" y="158" class="stage-sub">tagged calls go to</text>
  <text x="209" y="172" class="stage-sub">their agent; untagged</text>
  <text x="209" y="186" class="stage-sub">go to every agent on</text>
  <text x="209" y="200" class="stage-sub">the service account</text>
  <text x="209" y="220" class="meta-block">1155 of 5210 untagged</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: PROPOSE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . PROPOSE</text>
  <text x="388" y="140" class="stage-title">Remove or narrow</text>
  <text x="388" y="158" class="stage-sub">no call: remove</text>
  <text x="388" y="172" class="stage-sub">group part called:</text>
  <text x="388" y="186" class="stage-sub">narrow to the members</text>
  <text x="388" y="200" class="stage-sub">--min-calls sets use</text>
  <text x="388" y="220" class="meta-strong">46 of 62 unneeded out</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: REPLAY -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . REPLAY</text>
  <text x="567" y="140" class="stage-title">Replay the calls</text>
  <text x="567" y="158" class="stage-sub">run the calls against</text>
  <text x="567" y="172" class="stage-sub">the smaller grant set</text>
  <text x="567" y="186" class="stage-sub">in-sample by design</text>
  <text x="567" y="220" class="meta-strong">0 of 5210 denied</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: REPORT -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="746" y="120" class="stage-num">5 . REPORT</text>
  <text x="746" y="140" class="stage-title">Proposals</text>
  <text x="746" y="158" class="stage-sub">text or annotations</text>
  <text x="746" y="172" class="stage-sub">proposes, never</text>
  <text x="746" y="186" class="stage-sub">applies a change</text>
  <text x="746" y="220" class="meta-strong">67 of 190 cut</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">Exit 0 or 1 or 2</text>
  <text x="262" y="330" class="stage-sub">1 when it proposes a change, 2 when input cannot be read</text>
  <text x="262" y="344" class="meta-strong">46 of 62 unneeded grants out, the review 4 of 62</text>

  <!-- Known misses box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">KNOWN MISSES</text>
  <text x="32" y="313" class="stage-title">What it gets wrong</text>
  <text x="32" y="330" class="stage-sub">14 kept on sibling credit</text>
  <text x="32" y="344" class="stage-sub">10 quarterly: 8 removed</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">owner question</text>
  <text x="742" y="328" class="stage-sub">hand-off to platform</text>
  <text x="742" y="343" class="stage-sub">decision record</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Annual review</text>
  <text x="32" y="406" class="meta-block">4 of 62 unneeded removed</text>
  <text x="32" y="424" class="stage-sub">its removals deny 155 of 5210 calls</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Log-count report, tagged</text>
  <text x="332" y="406" class="meta-block">14 of 74 flags are needed grants</text>
  <text x="332" y="424" class="stage-sub">finds 60 of 62, denies 4 of 5210</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">scopekeeper diff</text>
  <text x="632" y="406" class="meta-strong">46 of 62 removed, 0 denied</text>
  <text x="632" y="424" class="stage-sub">entitlements cut from 190 to 123</text>
</svg>
