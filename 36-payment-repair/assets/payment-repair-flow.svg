<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Payment Repair: one payment message, damaged fields found, each field sent through its tier, ending in one of four routes</title>
  <desc id="desc">Five-stage flow showing how a payment message and four reference tables move through a load and validate step, a damaged-field finder, a derivation step that proposes a value only from an allowed source, a tier gate that applies, holds for a digest-bound approval or refuses, and a record step that writes one audit row per change. The result is one route per message: PASS, REPAIRED, HOLD or RETURN. A dashed box marks the pieces that are design only. A comparison strip contrasts the next hop with no repair, a script that fills every empty field and Payment Repair on 500 synthetic messages.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Payment Repair - derive, gate, refuse, record</text>
  <text x="20" y="52" class="subheader">Each damaged field has a tier. The strictest outcome sets the route of the message.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 500 synthetic messages, 374 damaged fields</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">messages, four tables,</text>
  <text x="30" y="177" class="stage-sub">approvals if any</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: DETECT -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="209" y="120" class="stage-num">2 . DETECT</text>
  <text x="209" y="142" class="stage-title">Damaged fields?</text>
  <text x="209" y="162" class="stage-sub">missing, blank,</text>
  <text x="209" y="177" class="stage-sub">placeholder, malformed</text>
  <text x="209" y="192" class="stage-sub">optional fields: skip</text>
  <text x="209" y="212" class="meta-block">374 damaged fields</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: DERIVE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="388" y="120" class="stage-num">3 . DERIVE</text>
  <text x="388" y="142" class="stage-title">Allowed source?</text>
  <text x="388" y="162" class="stage-sub">one table row gives</text>
  <text x="388" y="177" class="stage-sub">one value, or the</text>
  <text x="388" y="192" class="stage-sub">tool refuses</text>
  <text x="388" y="212" class="meta-strong">249 of 374 sourced</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: TIER GATE -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . TIER GATE</text>
  <text x="567" y="142" class="stage-title">Tier of the field</text>
  <text x="567" y="162" class="stage-sub">AUTO: apply</text>
  <text x="567" y="177" class="stage-sub">APPROVAL: wait for digest</text>
  <text x="567" y="192" class="stage-sub">NEVER: return whole</text>
  <text x="567" y="212" class="meta-strong">766 of 766 blocked</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: RECORD -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="746" y="120" class="stage-num">5 . RECORD</text>
  <text x="746" y="142" class="stage-title">One row per change</text>
  <text x="746" y="162" class="stage-sub">old and new value,</text>
  <text x="746" y="177" class="stage-sub">source, tier, approver</text>
  <text x="746" y="192" class="stage-sub">digest of the plan</text>
  <text x="746" y="212" class="meta-strong">225 rows, 0 unsourced</text>

  <!-- Arrow from stage 5 down to the route -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: ROUTE -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . ROUTE</text>
  <text x="262" y="313" class="stage-title">PASS . REPAIRED . HOLD . RETURN</text>
  <text x="262" y="330" class="stage-sub">HOLD or RETURN exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">488 of 500 routes match the planted intent</text>

  <!-- Released box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">RELEASED FILE</text>
  <text x="32" y="313" class="stage-title">Messages out</text>
  <text x="32" y="330" class="stage-sub">PASS and REPAIRED only</text>
  <text x="32" y="344" class="stage-sub">audit CSV on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">signed approvals</text>
  <text x="742" y="328" class="stage-sub">dated reference tables</text>
  <text x="742" y="343" class="stage-sub">queue integration</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Next hop, no repair</text>
  <text x="32" y="406" class="meta-block">319 of 500 rejected for a person</text>
  <text x="32" y="424" class="stage-sub">34 of 374 damaged fields pass unseen</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Fill-every-field script</text>
  <text x="332" y="406" class="meta-block">126 of 500 released wrong or unusable</text>
  <text x="332" y="424" class="stage-sub">204 of 310 changes had no approval step</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Payment Repair, three tiers</text>
  <text x="632" y="406" class="meta-strong">21 of 371 released wrong or unusable</text>
  <text x="632" y="424" class="stage-sub">known miss: 12 well-formed wrong BICs pass</text>
</svg>
