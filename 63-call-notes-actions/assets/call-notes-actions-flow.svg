<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">call-notes-actions: each proposed CRM action checked against the sentence it cites, ending in ACCEPT, REVIEW or REJECT</title>
  <desc id="desc">Five-stage flow showing how a proposed CRM action and the call note it cites move through a citation check, a support check, a due date and amount check, an owner check and a modality check for conditional, negated, past or hedged sentences, ending in one decision of ACCEPT, REVIEW or REJECT per action and an exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts no check, an exact quote match and the five-part grounding check on 440 synthetic candidate actions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">call-notes-actions - every action has to point at a sentence</text>
  <text x="20" y="52" class="subheader">Five checks read the cited sentence. REJECT at 1 or 2, REVIEW at 3 to 5, otherwise ACCEPT.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 120 notes, 440 candidate actions</text>

  <!-- Stage 1: CITE -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="30" y="120" class="stage-num">1 . CITE</text>
  <text x="30" y="142" class="stage-title">Is the quote there?</text>
  <text x="30" y="162" class="stage-sub">quote inside the cited</text>
  <text x="30" y="177" class="stage-sub">sentence, case and</text>
  <text x="30" y="192" class="stage-sub">spacing ignored</text>
  <text x="30" y="212" class="meta-block">14 of 256 stopped alone</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: SUPPORT -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="209" y="120" class="stage-num">2 . SUPPORT</text>
  <text x="209" y="142" class="stage-title">Does it carry it?</text>
  <text x="209" y="162" class="stage-sub">trigger word for the</text>
  <text x="209" y="177" class="stage-sub">action type, and the</text>
  <text x="209" y="192" class="stage-sub">subject is named</text>
  <text x="209" y="212" class="meta-block">no match: REJECT</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: SLOTS -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . SLOTS</text>
  <text x="388" y="142" class="stage-title">Date and amount</text>
  <text x="388" y="162" class="stage-sub">due date in the</text>
  <text x="388" y="177" class="stage-sub">sentence, amount too</text>
  <text x="388" y="212" class="meta-block">not there: REVIEW</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: OWNER -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . OWNER</text>
  <text x="567" y="142" class="stage-title">Who is speaking?</text>
  <text x="567" y="162" class="stage-sub">I will: the manager</text>
  <text x="567" y="177" class="stage-sub">she will: the client</text>
  <text x="567" y="212" class="meta-block">187 of 256 by 1 to 4</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: MODALITY -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . MODALITY</text>
  <text x="746" y="142" class="stage-title">Said as a promise?</text>
  <text x="746" y="162" class="stage-sub">conditional, negated,</text>
  <text x="746" y="177" class="stage-sub">past or hedged words</text>
  <text x="746" y="192" class="stage-sub">hold the action</text>
  <text x="746" y="212" class="meta-block">38 of 256 still pass</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ACCEPT . REVIEW . REJECT</text>
  <text x="262" y="330" class="stage-sub">one decision and the reasons per action, exit 1 at the --fail-on level</text>
  <text x="262" y="344" class="meta-strong">38 of 256 written, 175 of 440 need a person</text>

  <!-- Caller box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CALLER</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">bad input exits 2</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">sentence splitter</text>
  <text x="742" y="328" class="stage-sub">held queue, CRM write</text>
  <text x="742" y="343" class="stage-sub">decision record</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No check</text>
  <text x="32" y="406" class="meta-block">256 of 440 ungrounded, all written</text>
  <text x="32" y="424" class="stage-sub">58.2% of the stub extractor output</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Exact quote match</text>
  <text x="332" y="406" class="meta-block">stops 6 of 256 ungrounded</text>
  <text x="332" y="424" class="stage-sub">rejects 29 of 184 grounded</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Five-part check</text>
  <text x="632" y="406" class="meta-strong">38 of 256 ungrounded written</text>
  <text x="632" y="424" class="stage-sub">known miss: 38 pass, 9 grounded held</text>
</svg>
