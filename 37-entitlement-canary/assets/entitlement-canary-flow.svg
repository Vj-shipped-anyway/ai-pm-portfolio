<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Entitlement Canary: one pull request to a retrieval system, canaries built from the access export, every returned document checked, ending in one decision</title>
  <desc id="desc">Five-stage flow showing how an access export becomes a pack of canaries, how the team's own test job runs each canary with a control query first, how the results file is loaded, how every returned document is checked against the access export of the pull request branch, and how coverage notes such as an unprimed or inert canary turn a clean run into a review. The result is one decision of ALLOW, REVIEW or BLOCK that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts a relevance-only eval, twelve hand-picked canaries with a string match and Entitlement Canary on 50 synthetic pull requests.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Entitlement Canary - did this change return a document to the wrong person?</text>
  <text x="20" y="52" class="subheader">Canaries come from the access export. Every returned document is checked, not only the target.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 50 synthetic pull requests, 120 documents</text>

  <!-- Stage 1: PACK -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="30" y="120" class="stage-num">1 . PACK</text>
  <text x="30" y="142" class="stage-title">Build the canaries</text>
  <text x="30" y="162" class="stage-sub">pairs a user may not</text>
  <text x="30" y="177" class="stage-sub">open, from four strata:</text>
  <text x="30" y="192" class="stage-sub">stale, nested, direct, plain</text>
  <text x="30" y="212" class="meta-strong">62 canaries in the pack</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: RUN -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="209" y="120" class="stage-num">2 . RUN</text>
  <text x="209" y="142" class="stage-title">Run the pack</text>
  <text x="209" y="162" class="stage-sub">your own test job asks</text>
  <text x="209" y="177" class="stage-sub">the control query first,</text>
  <text x="209" y="192" class="stage-sub">then the probe</text>
  <text x="209" y="212" class="meta-block">outside the tool</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: LOAD -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="388" y="120" class="stage-num">3 . LOAD</text>
  <text x="388" y="142" class="stage-title">Read the files</text>
  <text x="388" y="162" class="stage-sub">export, pack, results</text>
  <text x="388" y="177" class="stage-sub">bad input: exit 2</text>
  <text x="388" y="192" class="stage-sub">no result row: a note</text>
  <text x="388" y="212" class="meta-strong">never a silent pass</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: CHECK -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . CHECK</text>
  <text x="567" y="142" class="stage-title">Every returned doc</text>
  <text x="567" y="162" class="stage-sub">against the access</text>
  <text x="567" y="177" class="stage-sub">export of the branch,</text>
  <text x="567" y="192" class="stage-sub">not just the target</text>
  <text x="567" y="212" class="meta-strong">27 of 28 leaks caught</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: NOTES -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . NOTES</text>
  <text x="746" y="142" class="stage-title">Could it test it?</text>
  <text x="746" y="162" class="stage-sub">unprimed, inert, no</text>
  <text x="746" y="177" class="stage-sub">result, unknown id,</text>
  <text x="746" y="192" class="stage-sub">thin source: REVIEW</text>
  <text x="746" y="212" class="meta-block">3 of 22 clean to review</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . REVIEW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">any leak is BLOCK, notes only is REVIEW - BLOCK exits 1</text>
  <text x="262" y="344" class="meta-strong">27 of 28 leaking blocked, 0 of 22 clean blocked</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">scheduled access export</text>
  <text x="742" y="328" class="stage-sub">decision record</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Relevance eval only</text>
  <text x="32" y="406" class="meta-block">7 of 28 leaking stopped</text>
  <text x="32" y="424" class="stage-sub">739 leaked results scored as correct</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">12 canaries, string match</text>
  <text x="332" y="406" class="meta-block">3 of 28 leaking caught</text>
  <text x="332" y="424" class="stage-sub">5 of 22 clean flagged, all access grants</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Entitlement Canary</text>
  <text x="632" y="406" class="meta-strong">27 of 28 blocked, 0 of 22 clean blocked</text>
  <text x="632" y="424" class="stage-sub">known miss: PR-011 passes, one pair</text>
</svg>
