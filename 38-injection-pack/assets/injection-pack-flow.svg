<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Injection Pack: one rule change to a prompt gateway, a pack replayed on the old and the new rules, ending in a pass or a block</title>
  <desc id="desc">Five-stage flow showing how an old rule file, a new rule file and a pack of injection cases are loaded, how the pack is replayed on both rule files with each case read by one layer chosen by its channel, how the two runs are compared case by case so that a case the old rules got right and the new rules get wrong is a regression, how a changed rule that matches no pack case is flagged as a blind spot, and how optional floors can also fail the check. The result is ALLOW or BLOCK, and BLOCK exits 1 in the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts no pack in CI, a smoke test of six known strings and the full pack on 51 synthetic rule changes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Injection Pack - did this rule change make the gateway weaker?</text>
  <text x="20" y="52" class="subheader">The pack replays on the old and the new rules. A case that got worse fails the check.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 51 planted rule changes, 160-case pack</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">old rules, new rules,</text>
  <text x="30" y="177" class="stage-sub">and the pack (CSV)</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: REPLAY -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . REPLAY</text>
  <text x="209" y="142" class="stage-title">Run the pack twice</text>
  <text x="209" y="162" class="stage-sub">each case is read by</text>
  <text x="209" y="177" class="stage-sub">one layer, chosen by</text>
  <text x="209" y="192" class="stage-sub">its channel field</text>
  <text x="209" y="212" class="meta-strong">160 cases, 100 attacks</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: COMPARE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . COMPARE</text>
  <text x="388" y="142" class="stage-title">Case by case</text>
  <text x="388" y="162" class="stage-sub">old right, new wrong</text>
  <text x="388" y="177" class="stage-sub">= a regression</text>
  <text x="388" y="192" class="stage-sub">any regression: BLOCK</text>
  <text x="388" y="212" class="meta-strong">21 of 25 stopped</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: BLIND SPOTS -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . BLIND SPOTS</text>
  <text x="567" y="142" class="stage-title">Blind spots?</text>
  <text x="567" y="162" class="stage-sub">changed rule hits no</text>
  <text x="567" y="177" class="stage-sub">pack case: a note</text>
  <text x="567" y="192" class="stage-sub">empty layer: a note</text>
  <text x="567" y="212" class="meta-block">1 of 4 misses noted</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: FLOORS -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="746" y="120" class="stage-num">5 . FLOORS</text>
  <text x="746" y="142" class="stage-title">Optional floors</text>
  <text x="746" y="162" class="stage-sub">min catch percent,</text>
  <text x="746" y="177" class="stage-sub">max false blocks</text>
  <text x="746" y="192" class="stage-sub">off unless set</text>
  <text x="746" y="212" class="meta-block">alone: 5 of 25 stopped</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">a regression or a missed floor is BLOCK and exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">46 of 51 decisions match the held-out truth</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on a regression</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">pack kept by reviewers</text>
  <text x="742" y="328" class="stage-sub">decision record</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No pack in CI</text>
  <text x="32" y="406" class="meta-block">0 of 51 rule changes stopped</text>
  <text x="32" y="424" class="stage-sub">25 of 51 were harmful</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Smoke test, six strings</text>
  <text x="332" y="406" class="meta-block">3 of 25 harmful stopped</text>
  <text x="332" y="424" class="stage-sub">22 of 25 harmful changes pass</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Injection Pack, full pack</text>
  <text x="632" y="406" class="meta-strong">21 of 25 harmful stopped</text>
  <text x="632" y="424" class="stage-sub">1 of 26 harmless stopped, 4 of 25 pass</text>
</svg>
