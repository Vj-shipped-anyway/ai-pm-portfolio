<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Feature Contract: one delivery of a feature table, checked against its contract, ending in one decision</title>
  <desc id="desc">Four-stage flow showing how a contract and a delivery of model-input data move through a contract check, a delivery read, a structure check for missing columns and values that do not parse, and a value check for nulls, ranges and allowed lists with a bad-row tolerance, ending in one decision of PASS, WARN or FAIL that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts a pipeline with no input check, a header and type check and Feature Contract on 90 synthetic deliveries.</desc>

  <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
      </marker>
      <style>
        .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
        .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
        .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
        .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
        .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
        .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
        .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
        .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
        .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
        .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
        .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
        .arrow-head { fill: #5a5a5a; }
        .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
        .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
        .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
        .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
        .badge-bg { fill: #E6F1FB; }
        .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
        @media (prefers-color-scheme: dark) {
          .stage-box { fill: #161b22; stroke: #8b9bc7; }
          .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
          .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
          .stage-box-block { fill: #161b22; stroke: #f07878; }
          .stage-box-ship { fill: #161b22; stroke: #4ade80; }
          .stage-box-design { stroke: #9ca3af; }
          .strip-box { fill: #1c2128; stroke: #3b434d; }
          .stage-title { fill: #e6edf3; }
          .stage-sub { fill: #a8b3bf; }
          .stage-num { fill: #b6c4ee; }
          .arrow-line { stroke: #a8b3bf; }
          .arrow-head { fill: #a8b3bf; }
          .meta-strong { fill: #6ee7a0; }
          .meta-block { fill: #fca5a5; }
          .header { fill: #e6edf3; }
          .subheader { fill: #a8b3bf; }
          .badge-bg { fill: #1f2d44; }
          .badge-text { fill: #cfe0f7; }
        }
      </style>
    </defs>

  <text x="20" y="32" class="header">Feature Contract - one delivery, checked against its contract</text>
  <text x="20" y="52" class="subheader">Structure and value rules read a contract and a delivery. The strictest finding sets the decision.</text>

  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 90 deliveries of 100 rows from 3 feeds</text>

  <rect x="20" y="100" width="205" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . CONTRACT</text>
  <text x="30" y="142" class="stage-title">Check the contract</text>
  <text x="30" y="162" class="stage-sub">unknown key: exit 2</text>
  <text x="30" y="177" class="stage-sub">min above max: exit 2</text>
  <text x="30" y="192" class="stage-sub">typo is never a no-op</text>
  <text x="30" y="212" class="meta-strong">bad input: exit 2</text>
  <line x1="227" y1="166" x2="243" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="245" y="100" width="205" height="132" rx="8" class="stage-box"/>
  <text x="255" y="120" class="stage-num">2 . DELIVERY</text>
  <text x="255" y="142" class="stage-title">Read the delivery</text>
  <text x="255" y="162" class="stage-sub">CSV or JSON lines</text>
  <text x="255" y="177" class="stage-sub">100 rows per delivery</text>
  <text x="255" y="192" class="stage-sub">empty or ragged: exit 2</text>
  <text x="255" y="212" class="meta-strong">never a silent pass</text>
  <line x1="452" y1="166" x2="468" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="470" y="100" width="205" height="132" rx="8" class="stage-box-block"/>
  <text x="480" y="120" class="stage-num">3 . STRUCTURE</text>
  <text x="480" y="142" class="stage-title">Columns and types</text>
  <text x="480" y="162" class="stage-sub">listed column absent: FAIL</text>
  <text x="480" y="177" class="stage-sub">unlisted column: WARN</text>
  <text x="480" y="192" class="stage-sub">value will not parse: bad row</text>
  <text x="480" y="212" class="meta-block">alone: 16 of 47 stopped</text>
  <line x1="677" y1="166" x2="693" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="695" y="100" width="205" height="132" rx="8" class="stage-box-gate"/>
  <text x="705" y="120" class="stage-num">4 . VALUES</text>
  <text x="705" y="142" class="stage-title">Nulls, range, list</text>
  <text x="705" y="162" class="stage-sub">nulls over allowance</text>
  <text x="705" y="177" class="stage-sub">outside min, max or list</text>
  <text x="705" y="192" class="stage-sub">fails past 2.0% of rows</text>
  <text x="705" y="212" class="meta-block">alone: 21 of 47 stopped</text>

  <path d="M 797 232 L 797 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">5 . DECISION</text>
  <text x="262" y="313" class="stage-title">PASS . WARN . FAIL</text>
  <text x="262" y="330" class="stage-sub">highest finding wins - FAIL exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">37 of 47 bad stopped, 0 of 43 harmless blocked</text>

  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">reviewed contract repo</text>
  <text x="742" y="328" class="stage-sub">decision ledger</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No input check</text>
  <text x="32" y="406" class="meta-block">0 of 90 batches stopped</text>
  <text x="32" y="424" class="stage-sub">47 of 90 carry a changed field</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Header and type check</text>
  <text x="332" y="406" class="meta-block">16 of 47 bad batches stopped</text>
  <text x="332" y="424" class="stage-sub">blocks 14 of 43 harmless ones</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Feature Contract</text>
  <text x="632" y="406" class="meta-strong">37 of 47 stopped, 0 of 43 blocked</text>
  <text x="632" y="424" class="stage-sub">known miss: 10 of 47 pass</text>
</svg>
