<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">fairlens: one scores file, put through six fairness tests, ending in a verdict of PASS, REVIEW or FAIL</title>
  <desc id="desc">Five-stage flow showing how a scores file with a group column moves through a load and validate step, an approval gap and adverse impact ratio test with a bootstrap interval, a cutoff sweep, a proxy ablation and a pair of reason-code tests, ending in one verdict of PASS, REVIEW or FAIL that sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts a model card, a reason-code review alone and the six tests on 36 synthetic portfolios.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">fairlens - one scores file, six tests, one verdict</text>
  <text x="20" y="52" class="subheader">Each test returns PASS, REVIEW or FAIL. The highest verdict sets the exit code.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 36 portfolios, 29,460 applicants in all</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the file</text>
  <text x="30" y="162" class="stage-sub">group, score, outcome</text>
  <text x="30" y="177" class="stage-sub">group read, never inferred</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: T1 AND T2 -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="209" y="120" class="stage-num">2 . T1 AND T2</text>
  <text x="209" y="142" class="stage-title">Approval ratios</text>
  <text x="209" y="162" class="stage-sub">gap in points</text>
  <text x="209" y="177" class="stage-sub">ratio per group</text>
  <text x="209" y="192" class="stage-sub">with a 95% interval</text>
  <text x="209" y="212" class="meta-block">22 of 36 under 0.80</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: T3 -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . T3 CUTOFF SWEEP</text>
  <text x="388" y="142" class="stage-title">Move the cutoff</text>
  <text x="388" y="162" class="stage-sub">30 points either side</text>
  <text x="388" y="177" class="stage-sub">where does the screen</text>
  <text x="388" y="192" class="stage-sub">start to hold?</text>
  <text x="388" y="212" class="meta-block">FAIL follows T2</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: T4 -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . T4 PROXY ABLATION</text>
  <text x="567" y="142" class="stage-title">Drop the proxy</text>
  <text x="567" y="162" class="stage-sub">points to their mean,</text>
  <text x="567" y="177" class="stage-sub">re-run the decisions,</text>
  <text x="567" y="192" class="stage-sub">check accuracy</text>
  <text x="567" y="212" class="meta-block">7 of 14 proxies FAIL</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: T5 AND T6 -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . T5 AND T6</text>
  <text x="746" y="142" class="stage-title">Reasons by group</text>
  <text x="746" y="162" class="stage-sub">matched declines,</text>
  <text x="746" y="177" class="stage-sub">same top reason?</text>
  <text x="746" y="192" class="stage-sub">is the proxy named?</text>
  <text x="746" y="212" class="meta-strong">pairs pass on 6 of 8</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: VERDICT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . VERDICT</text>
  <text x="262" y="313" class="stage-title">PASS . REVIEW . FAIL</text>
  <text x="262" y="330" class="stage-sub">highest verdict wins - exit 1 at your level, 2 for bad input</text>
  <text x="262" y="344" class="meta-strong">10 of 14 planted proxies FAIL, 2 of 22 others</text>

  <!-- Validator box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">VALIDATOR</text>
  <text x="32" y="313" class="stage-title">Report or CI step</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">reviewed thresholds</text>
  <text x="742" y="328" class="stage-sub">run record</text>
  <text x="742" y="343" class="stage-sub">group-label intake</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Model card</text>
  <text x="32" y="406" class="meta-block">0 of 6 fairness tests run</text>
  <text x="32" y="424" class="stage-sub">accuracy 73.3% vs 75.4%</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Reason review alone</text>
  <text x="332" y="406" class="meta-block">13 of 14 planted proxies pass</text>
  <text x="332" y="424" class="stage-sub">0 of 14 marked FAIL</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">fairlens, six tests</text>
  <text x="632" y="406" class="meta-strong">10 of 14 FAIL, 2 of 22 others FAIL</text>
  <text x="632" y="424" class="stage-sub">known miss: 7 of 14 not FAIL on T4</text>
</svg>
