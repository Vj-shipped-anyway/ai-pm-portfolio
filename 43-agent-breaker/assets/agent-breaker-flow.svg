<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">agent-breaker: one agent call routed to the agent or to a person, tripped by three rules, tested by probes and recorded in a hash-chained log</title>
  <desc id="desc">Five-stage flow showing how an agent's recorded tool calls move through a load and validate step, a route to the agent or to a human queue, three trip rules, a hold and probe stage for the way back, and a hash-chained log that a replay can check, ending in a route per call, a log with a head hash and an exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts no stop, a common breaker that trips on failures in a row and agent_breaker on 7523 synthetic calls.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">agent-breaker - trip, hold for a person, probe, and keep a log that replays</text>
  <text x="20" y="52" class="subheader">One breaker per agent. A call goes to the agent or to a human queue, and every step is chained in the log.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 5 agents, 7523 calls, 25 planted faults</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">events and controls</text>
  <text x="30" y="177" class="stage-sub">policy thresholds</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: ROUTE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . ROUTE</text>
  <text x="209" y="142" class="stage-title">Where does it go?</text>
  <text x="209" y="162" class="stage-sub">CLOSED: to the agent</text>
  <text x="209" y="177" class="stage-sub">OPEN: to a person</text>
  <text x="209" y="192" class="stage-sub">FORCED_OPEN: switch</text>
  <text x="209" y="212" class="meta-strong">0 reached agent when open</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: TRIP -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . TRIP</text>
  <text x="388" y="142" class="stage-title">Three trip rules</text>
  <text x="388" y="162" class="stage-sub">scope violation at once</text>
  <text x="388" y="177" class="stage-sub">5 failures in a row</text>
  <text x="388" y="192" class="stage-sub">rate 0.5 over 30 min</text>
  <text x="388" y="212" class="meta-strong">12 of 14 must-trip</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: RECOVER -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . RECOVER</text>
  <text x="567" y="142" class="stage-title">Hold and probe</text>
  <text x="567" y="162" class="stage-sub">hold 30 min, doubles</text>
  <text x="567" y="177" class="stage-sub">3 good probes close</text>
  <text x="567" y="192" class="stage-sub">release goes to probes</text>
  <text x="567" y="212" class="meta-block">267 harmless held</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: LOG -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . LOG</text>
  <text x="746" y="142" class="stage-title">Hash-chained log</text>
  <text x="746" y="162" class="stage-sub">every call and change</text>
  <text x="746" y="177" class="stage-sub">replay must agree</text>
  <text x="746" y="192" class="stage-sub">head hash kept apart</text>
  <text x="746" y="212" class="meta-strong">7599 events, intact</text>

  <!-- Arrow from stage 5 down to the output -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . OUTPUT</text>
  <text x="262" y="313" class="stage-title">Route, log and exit code</text>
  <text x="262" y="330" class="stage-sub">agent or human queue per call, exit 1 on a trip or a bad log</text>
  <text x="262" y="344" class="meta-strong">142 of 312 harmful calls served</text>

  <!-- Human queue box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">HUMAN QUEUE</text>
  <text x="32" y="313" class="stage-title">Held calls wait</text>
  <text x="32" y="330" class="stage-sub">a person reads them</text>
  <text x="32" y="344" class="stage-sub">reason on each call</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">live loop wrapper</text>
  <text x="742" y="328" class="stage-sub">queue connector</text>
  <text x="742" y="343" class="stage-sub">shared state store</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No stop</text>
  <text x="32" y="406" class="meta-block">312 harmful calls, all served</text>
  <text x="32" y="424" class="stage-sub">a person every 60 min (modeled): 247</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Common breaker</text>
  <text x="332" y="406" class="meta-block">9 of 14 tripped, 168 of 312 served</text>
  <text x="332" y="424" class="stage-sub">0 of 3 scope violations tripped</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">agent_breaker</text>
  <text x="632" y="406" class="meta-strong">12 of 14 tripped, 142 of 312 served</text>
  <text x="632" y="424" class="stage-sub">price: 267 harmless held, not 140</text>
</svg>
