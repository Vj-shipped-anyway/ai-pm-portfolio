<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">recon-agent: two ledgers matched by five rules, re-checked and gated, ending in a match list and an open list</title>
  <desc id="desc">Five-stage flow showing how a bank statement, a cash book and an approvals file move through a load and validate step, a ladder of five matching rules, a re-check of the rule on the cited lines, an approval gate and an open list that gives every unposted line a reason. The result is a match list with evidence and an open list with reasons, and a verify step re-checks a finished list. A dashed box marks the pieces that are design only. A comparison strip contrasts a lookup on amount and date, the rule ladder alone, and the ladder with the check and the gate on one synthetic month.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">recon-agent - match two ledgers, show why, hold the risky ones</text>
  <text x="20" y="52" class="subheader">Five rules propose. A re-check and a gate decide what posts. Every other line gets a reason.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="420" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 383 bank lines and 438 book lines in one month</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="140" class="stage-title">Read the files</text>
  <text x="30" y="158" class="stage-sub">bank statement</text>
  <text x="30" y="172" class="stage-sub">cash book</text>
  <text x="30" y="186" class="stage-sub">approvals file</text>
  <text x="30" y="200" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="220" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: PROPOSE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . PROPOSE</text>
  <text x="209" y="140" class="stage-title">Rule ladder</text>
  <text x="209" y="158" class="stage-sub">ref_exact, ref_fee,</text>
  <text x="209" y="172" class="stage-sub">batch_sum, ref_near,</text>
  <text x="209" y="186" class="stage-sub">name_amount in order</text>
  <text x="209" y="200" class="stage-sub">ties are parked</text>
  <text x="209" y="220" class="meta-block">ladder alone: 6 wrong</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: CHECK -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . CHECK</text>
  <text x="388" y="140" class="stage-title">Re-run the rule</text>
  <text x="388" y="158" class="stage-sub">on the lines a match</text>
  <text x="388" y="172" class="stage-sub">cites, before it posts</text>
  <text x="388" y="186" class="stage-sub">a failure blocks it</text>
  <text x="388" y="220" class="meta-strong">311 of 311 re-check</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: GATE -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . GATE</text>
  <text x="567" y="140" class="stage-title">Who may post?</text>
  <text x="567" y="158" class="stage-sub">ref_exact up to</text>
  <text x="567" y="172" class="stage-sub">10000.00 posts alone</text>
  <text x="567" y="186" class="stage-sub">all else waits for a</text>
  <text x="567" y="200" class="stage-sub">person, not the agent</text>
  <text x="567" y="220" class="meta-block">101 held for a person</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: OPEN LIST -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="746" y="120" class="stage-num">5 . OPEN LIST</text>
  <text x="746" y="140" class="stage-title">Reason per line</text>
  <text x="746" y="158" class="stage-sub">every line not posted</text>
  <text x="746" y="172" class="stage-sub">is listed with why:</text>
  <text x="746" y="186" class="stage-sub">no_counterpart 89</text>
  <text x="746" y="200" class="stage-sub">reference_conflict 28</text>
  <text x="746" y="220" class="meta-strong">169 open, reason each</text>

  <!-- Arrow from stage 5 down to the report -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: REPORT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . REPORT</text>
  <text x="262" y="313" class="stage-title">matches.csv . unmatched.csv</text>
  <text x="262" y="330" class="stage-sub">218 post on their own, 93 on approval, 8 rejected</text>
  <text x="262" y="344" class="meta-strong">a person reads 385 of 821 lines, not 821</text>

  <!-- Verify box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">VERIFY</text>
  <text x="32" y="313" class="stage-title">Re-check a list</text>
  <text x="32" y="330" class="stage-sub">swapped line: 299 of 299</text>
  <text x="32" y="344" class="stage-sub">relabelled: 93 of 93</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">approver queue</text>
  <text x="742" y="328" class="stage-sub">decision record</text>
  <text x="742" y="343" class="stage-sub">ledger posting</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Lookup on amount, date</text>
  <text x="32" y="406" class="meta-block">316 posted, 25 wrong</text>
  <text x="32" y="424" class="stage-sub">a reason recorded for 0 of 316</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Ladder alone, all posted</text>
  <text x="332" y="406" class="meta-block">319 posted, 6 wrong</text>
  <text x="332" y="424" class="stage-sub">101 posted with nobody looking</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Ladder, check and gate</text>
  <text x="632" y="406" class="meta-strong">218 on their own, 0 wrong</text>
  <text x="632" y="424" class="stage-sub">known miss: 18 never proposed</text>
</svg>
