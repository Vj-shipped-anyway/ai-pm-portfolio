<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Trajectory Eval: one recorded agent run, graded on its steps, order, forbidden tools, stop signals and budget, ending in PASS or FAIL with the reason</title>
  <desc id="desc">Five-stage flow showing how task rubrics and recorded agent runs move through a load and validate step, a required-step match, an order check, a safety check for forbidden tools and stop signals, and a check of the call budget and the final answer, ending in PASS or FAIL for each run with the reason, and an exit code for the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts no step grading, a final-answer check and the trajectory scorer on 240 recorded synthetic runs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Trajectory Eval - one recorded run, graded on its steps and not only its answer</text>
  <text x="20" y="52" class="subheader">Steps, order, safety, then budget and answer. A run passes only when every condition holds.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="400" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 20 tasks, 240 recorded runs, 96 planted as defective</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">task rubrics</text>
  <text x="30" y="177" class="stage-sub">recorded runs</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: STEPS -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . STEPS</text>
  <text x="209" y="142" class="stage-title">Required steps</text>
  <text x="209" y="162" class="stage-sub">tool and named args</text>
  <text x="209" y="177" class="stage-sub">equivalent tools listed</text>
  <text x="209" y="192" class="stage-sub">a failed call is no step</text>
  <text x="209" y="212" class="meta-block">first reason: 30 missing</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: ORDER -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . ORDER</text>
  <text x="388" y="142" class="stage-title">Right sequence?</text>
  <text x="388" y="162" class="stage-sub">a step must follow</text>
  <text x="388" y="177" class="stage-sub">its earlier steps</text>
  <text x="388" y="192" class="stage-sub">independent steps swap</text>
  <text x="388" y="212" class="meta-block">14 acted too early</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: SAFETY -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . SAFETY</text>
  <text x="567" y="142" class="stage-title">Allowed actions?</text>
  <text x="567" y="162" class="stage-sub">forbidden tool: FAIL</text>
  <text x="567" y="177" class="stage-sub">stop signal ignored:</text>
  <text x="567" y="192" class="stage-sub">FAIL, even if it errors</text>
  <text x="567" y="212" class="meta-block">14 forbidden, 12 ignored</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: BUDGET AND ANSWER -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . BUDGET, ANSWER</text>
  <text x="746" y="142" class="stage-title">Within the limits</text>
  <text x="746" y="162" class="stage-sub">calls within budget</text>
  <text x="746" y="177" class="stage-sub">final answer keys</text>
  <text x="746" y="192" class="stage-sub">score is a reading aid</text>
  <text x="746" y="212" class="meta-block">10 over budget</text>

  <!-- Arrow from stage 5 down to the verdict -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: VERDICT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . VERDICT</text>
  <text x="262" y="313" class="stage-title">PASS or FAIL with the reason</text>
  <text x="262" y="330" class="stage-sub">first reason by priority, exit 1 on a fail, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">90 of 96 defective caught, 6 of 144 sound fail</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on any failing run</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">trace collector</text>
  <text x="742" y="328" class="stage-sub">reviewed rubric repo</text>
  <text x="742" y="343" class="stage-sub">grade history</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No step grading</text>
  <text x="32" y="406" class="meta-block">236 of 240 runs accepted</text>
  <text x="32" y="424" class="stage-sub">92 of 236 accepted were defective</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Final-answer check</text>
  <text x="332" y="406" class="meta-block">12 of 96 defective caught</text>
  <text x="332" y="424" class="stage-sub">84 of 96 pass, 0 of 144 sound fail</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Trajectory scorer</text>
  <text x="632" y="406" class="meta-strong">90 of 96 defective caught</text>
  <text x="632" y="424" class="stage-sub">known miss: 6 of 96 note_leak pass</text>
</svg>
