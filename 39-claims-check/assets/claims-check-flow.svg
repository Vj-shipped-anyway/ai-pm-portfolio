<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Claims Check: one README and the text its scripts printed, every number after a green circle looked up, ending in pass or fail</title>
  <desc id="desc">Five-stage flow showing how a README and the output of its scripts are loaded, how the numbers after each green circle are found per paragraph, list item or table row with wrapped bullets joined and code, links and URLs skipped, how the printed text is indexed as whole numbers and as pairs written a of b on one line, how each claim is matched as a whole number or a pair, and how the report names the line and the reason for each unsupported number and counts the one-digit numbers it skipped. The result is PASS, FAIL or NOTHING CHECKED, and FAIL exits 1 in the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts no check, a one-line grep for each number and Claims Check on 284 synthetic bullets of which 98 are wrong.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Claims Check - is every green number printed by a script?</text>
  <text x="20" y="52" class="subheader">Numbers after a green circle must appear, as written, in the text the scripts printed.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 40 synthetic projects, 284 planted bullets</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">the README and the</text>
  <text x="30" y="177" class="stage-sub">text the scripts printed</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: EXTRACT -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . EXTRACT</text>
  <text x="209" y="142" class="stage-title">Find the claims</text>
  <text x="209" y="162" class="stage-sub">numbers after a green</text>
  <text x="209" y="177" class="stage-sub">circle, wrapped lines</text>
  <text x="209" y="192" class="stage-sub">joined, code skipped</text>
  <text x="209" y="212" class="meta-strong">284 bullets, 98 wrong</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: EVIDENCE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="388" y="120" class="stage-num">3 . EVIDENCE</text>
  <text x="388" y="142" class="stage-title">What was printed</text>
  <text x="388" y="162" class="stage-sub">every whole number,</text>
  <text x="388" y="177" class="stage-sub">and every a of b pair</text>
  <text x="388" y="192" class="stage-sub">on a single line</text>
  <text x="388" y="212" class="meta-block">301 numbers by hand</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: MATCH -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . MATCH</text>
  <text x="567" y="142" class="stage-title">Match the number</text>
  <text x="567" y="162" class="stage-sub">whole numbers only,</text>
  <text x="567" y="177" class="stage-sub">a longer figure does</text>
  <text x="567" y="192" class="stage-sub">not count</text>
  <text x="567" y="212" class="meta-strong">80 of 98 wrong caught</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: REPORT -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . REPORT</text>
  <text x="746" y="142" class="stage-title">Say which line</text>
  <text x="746" y="162" class="stage-sub">line, number, reason</text>
  <text x="746" y="177" class="stage-sub">one-digit numbers are</text>
  <text x="746" y="192" class="stage-sub">skipped and counted</text>
  <text x="746" y="212" class="meta-block">16 skipped, one digit</text>

  <!-- Arrow from stage 5 down to the result -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: RESULT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . RESULT</text>
  <text x="262" y="313" class="stage-title">PASS . FAIL . NOTHING CHECKED</text>
  <text x="262" y="330" class="stage-sub">an unsupported number is FAIL and exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">a person opens 88 of 284 bullets, 80 of 88 are real</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on a FAIL result</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">evidence freshness</text>
  <text x="742" y="328" class="stage-sub">decision record</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No check</text>
  <text x="32" y="406" class="meta-block">0 of 98 wrong bullets stopped</text>
  <text x="32" y="424" class="stage-sub">301 numbers compared by hand</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Grep, one line at a time</text>
  <text x="332" y="406" class="meta-block">38 of 98 wrong bullets caught</text>
  <text x="332" y="424" class="stage-sub">19 of 186 fine bullets flagged</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Claims Check</text>
  <text x="632" y="406" class="meta-strong">80 of 98 caught, 8 of 186 flagged</text>
  <text x="632" y="424" class="stage-sub">still passes: coincidence 10, single digit 8</text>
</svg>
