<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">ShadowScan: from proxy and DNS log rows to a ranked next action</title>
  <desc id="desc">Four-stage flow. Proxy and DNS logs are classified by catalog, feed, generation-style path and upload-heavy ratio, ranked by data exposure, and turned into a block, sanction or coach recommendation that a person reviews. A comparison strip contrasts a blocklist with ShadowScan on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">ShadowScan - from a log row to a ranked next action</text>
  <text x="20" y="52" class="subheader">Proxy and DNS logs in. Each domain and path classified, ranked by data exposure, then block, sanction or coach.</text>

  <rect x="20" y="78" width="290" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Input: a batch of proxy rows and DNS lookups</text>

  <rect x="20" y="120" width="150" height="118" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . LOGS</text>
  <text x="32" y="162" class="stage-title">Proxy and DNS</text>
  <text x="32" y="180" class="stage-sub">proxy: path, bytes</text>
  <text x="32" y="195" class="stage-sub">DNS: a name only</text>
  <text x="32" y="210" class="stage-sub">no content read</text>
  <text x="32" y="225" class="meta-text">15,000 + 7,500 rows</text>
  <rect x="220" y="120" width="185" height="118" rx="8" class="stage-box-eval"/>
  <text x="232" y="140" class="stage-num">2 . CLASSIFY</text>
  <text x="232" y="162" class="stage-title">Domain and path</text>
  <text x="232" y="180" class="stage-sub">catalog: sanctioned</text>
  <text x="232" y="195" class="stage-sub">feed or rules: flagged</text>
  <text x="232" y="210" class="stage-sub">SaaS AI path: embedded</text>
  <text x="232" y="225" class="meta-strong">3,948 of 4,200 found</text>
  <rect x="455" y="120" width="195" height="118" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . RANK</text>
  <text x="467" y="162" class="stage-title">By data exposure</text>
  <text x="467" y="180" class="stage-sub">bytes out x dept weight</text>
  <text x="467" y="195" class="stage-sub">x distinct staff</text>
  <text x="467" y="210" class="stage-sub">proxy rows only</text>
  <text x="467" y="225" class="meta-strong">28 of 30 tools found</text>
  <rect x="700" y="120" width="200" height="118" rx="8" class="stage-box-gate"/>
  <text x="712" y="140" class="stage-num">4 . ACT</text>
  <text x="712" y="162" class="stage-title">Block, sanction, coach</text>
  <text x="712" y="180" class="stage-sub">owner department named</text>
  <text x="712" y="195" class="stage-sub">catalog alternative shown</text>
  <text x="712" y="210" class="stage-sub">a person confirms</text>
  <text x="712" y="225" class="meta-block">10 block 2 sanction 23 coach</text>

  <line x1="175" y1="179" x2="217" y2="179" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="410" y1="179" x2="452" y2="179" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="655" y1="179" x2="697" y2="179" class="arrow-line" marker-end="url(#arrow)"/>

  <path d="M 800 238 L 800 264 L 410 264 L 410 288" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="240" y="290" width="340" height="118" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . REVIEW QUEUE</text>
  <text x="252" y="332" class="stage-title">Sanction goes to intake first</text>
  <text x="252" y="350" class="stage-sub">TierGate intake, VendorLens diligence</text>
  <text x="252" y="365" class="stage-sub">(designed, none built)</text>
  <text x="252" y="395" class="meta-block">false positives: 542 sessions on 2 domains</text>

  <path d="M 240 340 L 210 340" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="20" y="290" width="190" height="118" rx="8" class="stage-box-ship"/>
  <text x="32" y="310" class="stage-num">OWNER</text>
  <text x="32" y="332" class="stage-title">Department gets a call</text>
  <text x="32" y="350" class="stage-sub">the next action,</text>
  <text x="32" y="365" class="stage-sub">with the evidence</text>
  <text x="32" y="395" class="meta-strong">35 ranked items</text>

  <rect x="610" y="290" width="285" height="118" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="622" y="312" class="stage-title">Same logs, two views</text>
  <text x="622" y="337" class="timer">Blocklist: 2,275 of 4,200 found</text>
  <text x="622" y="357" class="timer-fast">ShadowScan: 3,948 of 4,200 found</text>
  <text x="622" y="385" class="meta-strong">known limit: 600 off-network sessions unseen</text>
</svg>
