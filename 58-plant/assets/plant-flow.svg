<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">plant: a spec becomes data with no label column and a separate answer key, and a checker is scored against the key</title>
  <desc id="desc">Five-stage flow showing how a spec of columns and named behaviors is validated, used to plant failures and look-alikes on exact rows, written out as a data file with no label column, a separate answer key and a manifest with hashes, handed to a checker that flags row ids, and scored against the key behavior by behavior. The result is a per-behavior table and an exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts a run with no key, a test file with an is_bad column, and a planted key on one synthetic ledger.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">plant - plant the failure, keep the key, score the checker</text>
  <text x="20" y="52" class="subheader">The key is a separate file. The data file carries no label.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="420" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: a spec with seed 58 and 7 named behaviors</text>

  <!-- Stage 1: SPEC -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . SPEC</text>
  <text x="30" y="140" class="stage-title">Validate</text>
  <text x="30" y="158" class="stage-sub">seed, columns, and</text>
  <text x="30" y="172" class="stage-sub">behaviors with a role,</text>
  <text x="30" y="186" class="stage-sub">a count and an edit</text>
  <text x="30" y="200" class="stage-sub">bad spec: exit 2</text>
  <text x="30" y="220" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: PLANT -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . PLANT</text>
  <text x="209" y="140" class="stage-title">Plant exact rows</text>
  <text x="209" y="158" class="stage-sub">base rows first, then</text>
  <text x="209" y="172" class="stage-sub">each behavior on rows</text>
  <text x="209" y="186" class="stage-sub">no other one used</text>
  <text x="209" y="200" class="stage-sub">failures and look-alikes</text>
  <text x="209" y="220" class="meta-strong">84 failures, 30 look-alikes</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: WRITE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . WRITE</text>
  <text x="388" y="140" class="stage-title">Three files</text>
  <text x="388" y="158" class="stage-sub">data, no label column</text>
  <text x="388" y="172" class="stage-sub">key, one line per row</text>
  <text x="388" y="186" class="stage-sub">manifest with hashes</text>
  <text x="388" y="220" class="meta-strong">8 columns, 0 labels</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: CHECKER -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . CHECKER</text>
  <text x="567" y="140" class="stage-title">Flag row ids</text>
  <text x="567" y="158" class="stage-sub">any checker reads the</text>
  <text x="567" y="172" class="stage-sub">data file and writes</text>
  <text x="567" y="186" class="stage-sub">a flags file with a</text>
  <text x="567" y="200" class="stage-sub">row_id column</text>
  <text x="567" y="220" class="meta-block">naive flags 126 rows</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: SCORE -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="746" y="120" class="stage-num">5 . SCORE</text>
  <text x="746" y="140" class="stage-title">Against the key</text>
  <text x="746" y="158" class="stage-sub">per behavior: found,</text>
  <text x="746" y="172" class="stage-sub">look-alikes flagged,</text>
  <text x="746" y="186" class="stage-sub">clean rows flagged;</text>
  <text x="746" y="200" class="stage-sub">key hash is checked</text>
  <text x="746" y="220" class="meta-strong">71 of 84 found</text>

  <!-- Arrow from stage 5 down to the report -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: REPORT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . REPORT</text>
  <text x="262" y="313" class="stage-title">Per-behavior table and exit code</text>
  <text x="262" y="330" class="stage-sub">exit 1 when a failure falls under --min-recall</text>
  <text x="262" y="344" class="meta-block">weakest: memo_injection_paraphrase, 0 of 12</text>

  <!-- Reproduce box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">REPRODUCE</text>
  <text x="32" y="313" class="stage-title">Same seed</text>
  <text x="32" y="330" class="stage-sub">identical bytes: yes</text>
  <text x="32" y="344" class="stage-sub">seeds 58 to 62: 84 each</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">spec and key registry</text>
  <text x="742" y="328" class="stage-sub">run record</text>
  <text x="742" y="343" class="stage-sub">CI step</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No key</text>
  <text x="32" y="406" class="meta-block">508 rows to read by hand</text>
  <text x="32" y="424" class="stage-sub">91 to 120 naive flags per file</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">An is_bad column</text>
  <text x="332" y="406" class="meta-block">tuned recall 0.89, precision 0.92</text>
  <text x="332" y="424" class="stage-sub">hides 0 of 50 paraphrased found</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">plant, a separate key</text>
  <text x="632" y="406" class="meta-strong">tuned finds 72 of 84, flags 0 of 30</text>
  <text x="632" y="424" class="stage-sub">known miss: 12 paraphrases found 0</text>
</svg>
