<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">ControlMap: an AI obligation checked against controls and evidence, ending in one status</title>
  <desc id="desc">Five-stage flow showing how an AI-related obligation moves through a theme dictionary that finds the controls that meet it, a scope check that sizes the match, an evidence-freshness check that dates it, and one status of COVERED, STALE, PARTIAL or UNCOVERED. A comparison strip contrasts a keyword spreadsheet with ControlMap on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">ControlMap - one obligation, checked against controls and evidence</text>
  <text x="20" y="52" class="subheader">The dictionary finds the control, the scope check sizes it, the freshness check dates it. The output is one status.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Input: 48 obligations, 60 controls, 153 evidence items</text>

  <!-- Stage 1: OBLIGATION -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . OBLIGATION</text>
  <text x="32" y="162" class="stage-title">Obligation row</text>
  <text x="32" y="180" class="stage-sub">framework + theme</text>
  <text x="32" y="195" class="stage-sub">applies_to classes</text>
  <text x="32" y="210" class="stage-sub">paraphrase of rule</text>
  <text x="32" y="223" class="meta-text">20 themes, 4 frameworks</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: DICTIONARY -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . THEME DICTIONARY</text>
  <text x="237" y="162" class="stage-title">Find the control</text>
  <text x="237" y="180" class="stage-sub">synonym groups</text>
  <text x="237" y="195" class="stage-sub">93 phrases, a table</text>
  <text x="237" y="210" class="stage-sub">retired never match</text>
  <text x="237" y="225" class="meta-strong">precision 97.4%</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: SCOPE -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . SCOPE CHECK</text>
  <text x="467" y="162" class="stage-title">Size the match</text>
  <text x="467" y="180" class="stage-sub">full: every class held</text>
  <text x="467" y="195" class="stage-sub">partial: a class missed</text>
  <text x="467" y="210" class="stage-sub">one control at a time</text>
  <text x="467" y="225" class="meta-strong">150 of 150 labels right</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: FRESHNESS -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . EVIDENCE FRESHNESS</text>
  <text x="717" y="162" class="stage-title">Date the evidence</text>
  <text x="717" y="180" class="stage-sub">fresh: 1.5 cycles max</text>
  <text x="717" y="195" class="stage-sub">stale or none: flagged</text>
  <text x="717" y="210" class="stage-sub">as of 2026-09-30</text>
  <text x="717" y="225" class="meta-block">7 STALE obligations found</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: STATUS -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . ONE STATUS PER OBLIGATION</text>
  <text x="252" y="330" class="stage-title">COVERED . STALE . PARTIAL . UNCOVERED</text>
  <text x="252" y="352" class="stage-sub">plus orphan controls and 20 requests</text>
  <text x="252" y="368" class="meta-block">46 of 48 statuses right, reason on every row</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: REVIEWER -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">exam answer</text>
  <text x="32" y="423" class="stage-sub">control and its age</text>
  <text x="32" y="436" class="meta-strong">gaps are named</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same obligations, two worlds</text>
  <text x="612" y="332" class="timer">Keyword sheet: 23 of 48 right status</text>
  <text x="612" y="350" class="timer-fast">ControlMap: 46 of 48 right status</text>
  <text x="612" y="370" class="meta-strong">known limit: 6 true pairs missed</text>
</svg>
