<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">plan-guard: one Terraform plan, read by ten rules and unknown handling, ending in one decision</title>
  <desc id="desc">Five-stage flow showing how a Terraform plan in JSON form moves through a load and validate step, a scope step that keeps only resources the plan creates or updates, nine high-severity rules that give BLOCK, one medium rule for plain HTTP listeners that gives REVIEW, and a check for values known only after apply that gives REVIEW, ending in one decision of ALLOW, REVIEW or BLOCK that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts a pipeline with no plan check, a text search with 8 patterns and plan-guard on 86 synthetic plans.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">plan-guard - one plan, ten rules, one decision before apply</text>
  <text x="20" y="52" class="subheader">Only what the plan creates or updates is read. The strictest finding sets the decision.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 86 synthetic plans, 388 resource changes</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the plan</text>
  <text x="30" y="162" class="stage-sub">terraform show -json</text>
  <text x="30" y="177" class="stage-sub">shape checked</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">86 plans, 388 changes</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: SCOPE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . SCOPE</text>
  <text x="209" y="142" class="stage-title">Create or update</text>
  <text x="209" y="162" class="stage-sub">delete, no-op skipped</text>
  <text x="209" y="177" class="stage-sub">type must have a rule</text>
  <text x="209" y="212" class="meta-block">7 of 34 if ignored</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: NINE HIGH RULES -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . NINE HIGH RULES</text>
  <text x="388" y="142" class="stage-title">Open or plain</text>
  <text x="388" y="162" class="stage-sub">public ACL, open port</text>
  <text x="388" y="177" class="stage-sub">unencrypted store</text>
  <text x="388" y="192" class="stage-sub">any hit gives BLOCK</text>
  <text x="388" y="212" class="meta-strong">33 of 42 blocked</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: ONE MEDIUM RULE -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . ONE MEDIUM RULE</text>
  <text x="567" y="142" class="stage-title">Plain HTTP</text>
  <text x="567" y="162" class="stage-sub">listener without a</text>
  <text x="567" y="177" class="stage-sub">redirect to HTTPS</text>
  <text x="567" y="192" class="stage-sub">hit gives REVIEW</text>
  <text x="567" y="212" class="meta-block">3 of 34 harmless read</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: UNKNOWNS -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . UNKNOWNS</text>
  <text x="746" y="142" class="stage-title">Known after apply</text>
  <text x="746" y="162" class="stage-sub">value not set yet</text>
  <text x="746" y="177" class="stage-sub">marked unverified</text>
  <text x="746" y="192" class="stage-sub">gives REVIEW</text>
  <text x="746" y="212" class="meta-strong">10 of 10 reviewed</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . REVIEW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">highest finding wins - BLOCK exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">33 of 42 risky blocked, 0 of 34 harmless blocked</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">reviewed policy config</text>
  <text x="742" y="328" class="stage-sub">decision ledger</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No plan check</text>
  <text x="32" y="406" class="meta-block">0 of 86 plans stopped</text>
  <text x="32" y="424" class="stage-sub">42 of 86 apply a risky resource</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Text search, 8 patterns</text>
  <text x="332" y="406" class="meta-block">17 of 52 never flagged</text>
  <text x="332" y="424" class="stage-sub">23 of 58 flags are harmless</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">plan-guard, ten rules</text>
  <text x="632" y="406" class="meta-strong">33 of 42 risky blocked</text>
  <text x="632" y="424" class="stage-sub">known miss: 9 of 42 risky pass</text>
</svg>
