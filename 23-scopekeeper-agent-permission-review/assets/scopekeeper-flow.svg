<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">ScopeKeeper: an agent's grants compared with its calls, then a least-privilege proposal and a dry-run replay</title>
  <desc id="desc">Five-stage flow showing how an agent's grants and 90 days of its calls are compared in a usage-versus-grant diff, turned into a proposed least-privilege scope set that is replayed against the logged calls, and sent to the agent owner and the access-governance reviewer. A comparison strip contrasts the annual recertification with ScopeKeeper on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">ScopeKeeper - permission review for one AI agent</text>
  <text x="20" y="52" class="subheader">Compare what the agent may do with what it did, propose the smallest set, replay the calls, then ask the owner.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="270" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: review date, or a new grant is added</text>

  <!-- Stage 1: GRANTS -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . GRANTS</text>
  <text x="32" y="162" class="stage-title">Held by agents</text>
  <text x="32" y="180" class="stage-sub">184 grants</text>
  <text x="32" y="195" class="stage-sub">launch + added later</text>
  <text x="32" y="210" class="stage-sub">wildcards, tickets</text>
  <text x="32" y="223" class="meta-text">69 of 184 never used</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: CALL LOG -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . CALL LOG</text>
  <text x="237" y="162" class="stage-title">90 days of calls</text>
  <text x="237" y="180" class="stage-sub">7,994 calls</text>
  <text x="237" y="195" class="stage-sub">scope, approval, account</text>
  <text x="237" y="210" class="stage-sub">shared account: no tag</text>
  <text x="237" y="225" class="meta-strong">1,723 untagged (21.6%)</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: USAGE DIFF -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-eval"/>
  <text x="467" y="140" class="stage-num">3 . USAGE DIFF</text>
  <text x="467" y="162" class="stage-title">Grant versus call</text>
  <text x="467" y="180" class="stage-sub">wildcards expanded</text>
  <text x="467" y="195" class="stage-sub">sibling calls credited</text>
  <text x="467" y="210" class="stage-sub">breadth score per agent</text>
  <text x="467" y="225" class="meta-strong">211 reachable, 126 called</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: PROPOSE + REPLAY -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-gate"/>
  <text x="717" y="140" class="stage-num">4 . PROPOSE + REPLAY</text>
  <text x="717" y="162" class="stage-title">Least-privilege set</text>
  <text x="717" y="180" class="stage-sub">keep remove narrow</text>
  <text x="717" y="195" class="stage-sub">dry-run of 90 days</text>
  <text x="717" y="210" class="stage-sub">risk rank of agents</text>
  <text x="717" y="225" class="meta-block">0 of 7,994 calls denied</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: ACT -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . ASK THE OWNER BEFORE REMOVING</text>
  <text x="252" y="330" class="stage-title">Owner and reviewer decide</text>
  <text x="252" y="352" class="stage-sub">attest periodic scopes . approve cuts</text>
  <text x="252" y="368" class="meta-block">69 removals, 8 are quarterly scopes</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: AGENT -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">agent scopes</text>
  <text x="32" y="423" class="stage-sub">match what is called</text>
  <text x="32" y="436" class="meta-strong">periodic ones attested</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same grants, two reviews</text>
  <text x="612" y="332" class="timer">Annual review: removed 2 of 184 grants</text>
  <text x="612" y="350" class="timer-fast">ScopeKeeper: 61 of 71 unneeded removed</text>
  <text x="612" y="370" class="meta-strong">known limit: 8 quarterly grants cut</text>
</svg>
