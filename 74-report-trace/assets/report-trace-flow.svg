<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">report-trace: every cell of a filed report traced to the source rows behind it and checked against today's source, ending in one exit code</title>
  <desc id="desc">Six-stage flow showing how a loan table, a report spec, the filed values and an adjustment log move through a load and validate step, a capture step that keeps the rule and rows behind each cell, a leaf-cell check against today's source, a check that totals and ratios foot, and a check for loans in no cell, ending in one exit code that fails the review step when a cell needs a person. A dashed box marks the pieces that are design only. A comparison strip contrasts having no recorded path, a mapping sheet re-run and row-level lineage on a synthetic report of 71 cells.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">report-trace - every cell traced to its rows, checked against today's source</text>
  <text x="20" y="52" class="subheader">Capture at filing, verify before sign-off. A cell that cannot be explained fails the step.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 71 cells over a 3724-row loan table</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">loans, spec, filed</text>
  <text x="30" y="177" class="stage-sub">values, adjustments</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: CAPTURE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="209" y="120" class="stage-num">2 . CAPTURE</text>
  <text x="209" y="142" class="stage-title">At filing</text>
  <text x="209" y="162" class="stage-sub">keep the rule and the</text>
  <text x="209" y="177" class="stage-sub">rows behind each cell,</text>
  <text x="209" y="192" class="stage-sub">plus the adjustments</text>
  <text x="209" y="212" class="meta-strong">a path for every cell</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: LEAF CELLS -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . LEAF CELLS</text>
  <text x="388" y="142" class="stage-title">Rows vs today</text>
  <text x="388" y="162" class="stage-sub">traced, adjusted,</text>
  <text x="388" y="177" class="stage-sub">unexplained or</text>
  <text x="388" y="192" class="stage-sub">source changed</text>
  <text x="388" y="212" class="meta-strong">14 of 14 rows exact</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: DERIVED CELLS -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . DERIVED CELLS</text>
  <text x="567" y="142" class="stage-title">Do they foot?</text>
  <text x="567" y="162" class="stage-sub">sums and ratios vs</text>
  <text x="567" y="177" class="stage-sub">their filed inputs</text>
  <text x="567" y="212" class="meta-block">20 foot, 3 do not</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: LOANS IN NO CELL -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="746" y="120" class="stage-num">5 . NO CELL</text>
  <text x="746" y="142" class="stage-title">Loans in no cell</text>
  <text x="746" y="162" class="stage-sub">open loans no rule</text>
  <text x="746" y="177" class="stage-sub">reaches, and unmatched</text>
  <text x="746" y="192" class="stage-sub">adjustments</text>
  <text x="746" y="212" class="meta-strong">7 of 7 found</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . EXIT CODE</text>
  <text x="262" y="313" class="stage-title">0 . 1 . 2</text>
  <text x="262" y="330" class="stage-sub">1 when a cell, a loan or an adjustment needs a person</text>
  <text x="262" y="344" class="meta-strong">21 of 21 found, 0 of 46 clean or explained flagged</text>

  <!-- Review step box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">REVIEW STEP</text>
  <text x="32" y="313" class="stage-title">Fails or passes</text>
  <text x="32" y="330" class="stage-sub">annotations name the</text>
  <text x="32" y="344" class="stage-sub">cell and the loan ids</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">capture hook in the job</text>
  <text x="742" y="328" class="stage-sub">immutable lineage store</text>
  <text x="742" y="343" class="stage-sub">decision record</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No recorded path</text>
  <text x="32" y="406" class="meta-block">0 of 71 cells point to rows</text>
  <text x="32" y="424" class="stage-sub">a reviewer reads 3724 rows</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Mapping sheet re-run</text>
  <text x="332" y="406" class="meta-block">15 of 18 problems found</text>
  <text x="332" y="424" class="stage-sub">16 flags on cells that are fine</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Row-level lineage</text>
  <text x="632" y="406" class="meta-strong">21 of 21 found, 18 rows read, not 611</text>
  <text x="632" y="424" class="stage-sub">known miss: 4 of 4 wrong rows</text>
</svg>
