<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">name-match-eval: a watchlist, customer names and a truth file swept across thresholds for three matchers, ending in whether one threshold meets both a false-alert limit and a recall target</title>
  <desc id="desc">Five-stage flow showing how a watchlist, customer names and a truth file move through a load and validate step, a name normalizer, three matchers, a threshold sweep that counts planted matches caught and clear names alerted, and a check of two targets, ending in a yes or no on whether one threshold meets both and an exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts exact match, edit similarity and the word matcher at a 10.0 percent false-alert limit on 400 synthetic names.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">name-match-eval - what a threshold costs in missed names and false alerts</text>
  <text x="20" y="52" class="subheader">Three matchers are swept across thresholds against a labelled sample. Both columns are printed.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="400" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 400 names, 90 listed names, 150 planted matches</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">list, names, truth</text>
  <text x="30" y="177" class="stage-sub">every name has a label</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: NORMALIZE -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="209" y="120" class="stage-num">2 . NORMALIZE</text>
  <text x="209" y="142" class="stage-title">Fold the names</text>
  <text x="209" y="162" class="stage-sub">case, accents, marks</text>
  <text x="209" y="177" class="stage-sub">words and spelling</text>
  <text x="209" y="192" class="stage-sub">keys</text>
  <text x="209" y="212" class="meta-block">14 common swaps folded</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: MATCH -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="388" y="120" class="stage-num">3 . MATCH</text>
  <text x="388" y="142" class="stage-title">Three matchers</text>
  <text x="388" y="162" class="stage-sub">exact, edit, tokens</text>
  <text x="388" y="177" class="stage-sub">tokens: any order,</text>
  <text x="388" y="192" class="stage-sub">initials, rarity</text>
  <text x="388" y="212" class="meta-strong">order swaps: 24 of 24</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: SWEEP -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . SWEEP</text>
  <text x="567" y="142" class="stage-title">Sweep thresholds</text>
  <text x="567" y="162" class="stage-sub">caught, false alerts</text>
  <text x="567" y="177" class="stage-sub">at each threshold</text>
  <text x="567" y="192" class="stage-sub">0.30 to 1.00</text>
  <text x="567" y="212" class="meta-strong">tokens 57.3% recall</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: TARGETS -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . TARGETS</text>
  <text x="746" y="142" class="stage-title">Meet both targets?</text>
  <text x="746" y="162" class="stage-sub">false alerts under 10.0%</text>
  <text x="746" y="177" class="stage-sub">recall over 85.0%</text>
  <text x="746" y="212" class="meta-block">no threshold does</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: RESULT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . RESULT</text>
  <text x="262" y="313" class="stage-title">Yes . No</text>
  <text x="262" y="330" class="stage-sub">exit 1 when no threshold meets both, 2 for bad input</text>
  <text x="262" y="344" class="meta-strong">word matcher: 85.0% recall at 0.73, 18.4% false alerts</text>

  <!-- Review box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">THRESHOLD REVIEW</text>
  <text x="32" y="313" class="stage-title">Which one gives?</text>
  <text x="32" y="330" class="stage-sub">both columns go to the</text>
  <text x="32" y="344" class="stage-sub">approver, no names</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">labelled sample store</text>
  <text x="742" y="328" class="stage-sub">threshold-change record</text>
  <text x="742" y="343" class="stage-sub">capacity-based limit</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Exact match</text>
  <text x="32" y="406" class="meta-block">24 of 150 caught (16.0%)</text>
  <text x="32" y="424" class="stage-sub">8 false alerts on 250 clear names</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Edit, 10.0% limit</text>
  <text x="332" y="406" class="meta-block">36.0% recall at 0.93</text>
  <text x="332" y="424" class="stage-sub">85.0% recall not reachable</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Word matcher, same limit</text>
  <text x="632" y="406" class="meta-strong">57.3% recall at 0.93 (86 of 150)</text>
  <text x="632" y="424" class="stage-sub">alias_unlisted still 0 of 10</text>
</svg>
