<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">audit-chain: one agent log, read strictly and checked for sequence, hash, link and anchor, ending in OK or ALTERED</title>
  <desc id="desc">Five-stage flow showing how a JSON-lines agent log and an optional anchor move through a strict read, a sequence check, a hash check, a link check against the previous event and an anchor check, ending in one verdict of OK or ALTERED that sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts a log with no integrity check, a checksum with a sequence check, and the strict chain with an anchor on 91 planted tampering edits.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">audit-chain - one agent log, checked for sequence, hash, link and anchor</text>
  <text x="20" y="52" class="subheader">Each event carries the hash of the one before it. An anchor kept outside the log catches a cut or a rewrite.</text>

  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: one log of 280 events, 101 planted edits</text>

  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . READ</text>
  <text x="30" y="142" class="stage-title">Read strictly</text>
  <text x="30" y="162" class="stage-sub">duplicate key, NaN,</text>
  <text x="30" y="177" class="stage-sub">extra field, bad kind</text>
  <text x="30" y="192" class="stage-sub">each is a problem</text>
  <text x="30" y="212" class="meta-block">bare: 7 of 7 pass</text>
  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="209" y="120" class="stage-num">2 . SEQUENCE</text>
  <text x="209" y="142" class="stage-title">Gap-free sequence?</text>
  <text x="209" y="162" class="stage-sub">seq runs 1, 2, 3 ...</text>
  <text x="209" y="177" class="stage-sub">a gap or repeat is</text>
  <text x="209" y="192" class="stage-sub">a problem</text>
  <text x="209" y="212" class="meta-strong">deleted lines: 6 of 6</text>
  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . HASH</text>
  <text x="388" y="142" class="stage-title">Hash matches?</text>
  <text x="388" y="162" class="stage-sub">recomputed from the</text>
  <text x="388" y="177" class="stage-sub">event body and prev</text>
  <text x="388" y="192" class="stage-sub">mismatch is a problem</text>
  <text x="388" y="212" class="meta-strong">changed: 12 of 12</text>
  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-eval"/>
  <text x="567" y="120" class="stage-num">4 . LINK</text>
  <text x="567" y="142" class="stage-title">Link to previous?</text>
  <text x="567" y="162" class="stage-sub">prev must equal the</text>
  <text x="567" y="177" class="stage-sub">hash of the event</text>
  <text x="567" y="192" class="stage-sub">before it</text>
  <text x="567" y="212" class="meta-strong">each fix-up: 6 of 6</text>
  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . ANCHOR</text>
  <text x="746" y="142" class="stage-title">Anchor matches?</text>
  <text x="746" y="162" class="stage-sub">anchor at event 200</text>
  <text x="746" y="177" class="stage-sub">kept outside the log</text>
  <text x="746" y="192" class="stage-sub">cut or rewrite shows</text>
  <text x="746" y="212" class="meta-strong">anchored: 64 of 64</text>

  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . VERDICT</text>
  <text x="262" y="313" class="stage-title">OK . ALTERED</text>
  <text x="262" y="330" class="stage-sub">exit 0 OK, 1 ALTERED, 2 could not run</text>
  <text x="262" y="344" class="meta-strong">76 of 91 tampered flagged, 0 of 10 harmless flagged</text>

  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">REVIEWER</text>
  <text x="32" y="313" class="stage-title">Reads the verdict</text>
  <text x="32" y="330" class="stage-sub">problem line and code</text>
  <text x="32" y="344" class="stage-sub">append refuses a bad log</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">writer-held signing</text>
  <text x="742" y="328" class="stage-sub">locked anchor store</text>
  <text x="742" y="343" class="stage-sub">scheduled verify</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No integrity check</text>
  <text x="32" y="406" class="meta-block">0 of 91 tampered logs flagged</text>
  <text x="32" y="424" class="stage-sub">the edited file is well-formed</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Checksum and sequence</text>
  <text x="332" y="406" class="meta-block">18 of 91 flagged</text>
  <text x="332" y="424" class="stage-sub">0 of 13 recomputed-hash edits flagged</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Strict chain and anchor</text>
  <text x="632" y="406" class="meta-strong">76 of 91 flagged, 0 of 10 harmless</text>
  <text x="632" y="424" class="stage-sub">known miss: 15 of 91 in the open tail</text>

</svg>
