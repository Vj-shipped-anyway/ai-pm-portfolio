<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Tag Chargeback: one month of a cloud bill, allocated to cost centers by rule, ending in a chargeback and a list of unowned spend</title>
  <desc id="desc">Five-stage flow showing how a billing export, a cost-center registry, an account map and a tag policy move through a load and validate step, a tag rule, a shared-service split, an inherit rule and an account default, ending in an allocated chargeback and a list of unallocated spend that sets the exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts chargeback by account, a report grouped by the tag as written and Tag Chargeback on a synthetic bill of 1,284 lines.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Tag Chargeback - one monthly bill, allocated by rule</text>
  <text x="20" y="52" class="subheader">The first matching rule places each line. What is left is listed with a reason.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 1,284 lines, 12 accounts, 14 cost centers</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read four files</text>
  <text x="30" y="162" class="stage-sub">bill, policy, registry,</text>
  <text x="30" y="177" class="stage-sub">account map</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: TAG -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="209" y="120" class="stage-num">2 . TAG</text>
  <text x="209" y="142" class="stage-title">Tag names a team?</text>
  <text x="209" y="162" class="stage-sub">64.0% on exact tag</text>
  <text x="209" y="177" class="stage-sub">case and spaces fixed</text>
  <text x="209" y="192" class="stage-sub">bad tag: refused</text>
  <text x="209" y="212" class="meta-strong">75.5% with repair</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: SHARED SPLIT -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . SHARED SPLIT</text>
  <text x="388" y="142" class="stage-title">Shared service?</text>
  <text x="388" y="162" class="stage-sub">split in proportion</text>
  <text x="388" y="177" class="stage-sub">to what the other</text>
  <text x="388" y="192" class="stage-sub">rules allocated</text>
  <text x="388" y="212" class="meta-strong">16 of 16 handled</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: INHERIT -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . INHERIT</text>
  <text x="567" y="142" class="stage-title">Same resource?</text>
  <text x="567" y="162" class="stage-sub">its tagged lines agree:</text>
  <text x="567" y="177" class="stage-sub">use that cost center</text>
  <text x="567" y="212" class="meta-block">$418.67 placed wrong</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: ACCOUNT DEFAULT -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . ACCOUNT DEFAULT</text>
  <text x="746" y="142" class="stage-title">Dedicated account?</text>
  <text x="746" y="162" class="stage-sub">charge the account's</text>
  <text x="746" y="177" class="stage-sub">one team</text>
  <text x="746" y="192" class="stage-sub">runs last</text>
  <text x="746" y="212" class="meta-block">28.1% of it is wrong</text>

  <!-- Arrow from stage 5 down to the result -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: RESULT -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . RESULT</text>
  <text x="262" y="313" class="stage-title">ALLOCATED . UNALLOCATED</text>
  <text x="262" y="330" class="stage-sub">else unallocated with a reason - exit 1 over the limit</text>
  <text x="262" y="344" class="meta-strong">89.9% on the owner, 4.8% wrong, 5.2% left</text>

  <!-- Finance box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">FINANCE</text>
  <text x="32" y="313" class="stage-title">Chargeback and list</text>
  <text x="32" y="330" class="stage-sub">unallocated by reason</text>
  <text x="32" y="344" class="stage-sub">largest resources first</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">billing feed</text>
  <text x="742" y="328" class="stage-sub">reviewed policy</text>
  <text x="742" y="343" class="stage-sub">run record</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Chargeback by account</text>
  <text x="32" y="406" class="meta-block">55.8% on the owner</text>
  <text x="32" y="424" class="stage-sub">37.0% parked in a central pool</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Group by the tag as written</text>
  <text x="332" y="406" class="meta-block">64.0% on the owner</text>
  <text x="332" y="424" class="stage-sub">23.1% Unallocated, 34 values for 14</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Tag Chargeback, five rules</text>
  <text x="632" y="406" class="meta-strong">89.9% on the owner, 4.8% wrong</text>
  <text x="632" y="424" class="stage-sub">known miss: 24 lines, valid wrong tag</text>
</svg>
