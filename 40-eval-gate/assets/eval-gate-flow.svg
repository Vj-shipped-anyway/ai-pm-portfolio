<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Eval Gate: one model deploy, checked against the pinned snapshot and the probe results, ending in one decision</title>
  <desc id="desc">Five-stage flow showing how a probe file and a results file move through a load and validate step, a snapshot pin check, a coverage check, a pass-rate drop check and a high-severity probe collapse check, ending in one decision of ALLOW, REVIEW or BLOCK that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts a pipeline with no gate, a pass-rate floor of 0.90 and Eval Gate on 64 synthetic candidate deploys.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Eval Gate - one deploy, checked against the pin and the probe results</text>
  <text x="20" y="52" class="subheader">Four rules read two files and a pin. The strictest finding sets the decision.</text>

  <!-- Input badge -->
  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 64 candidate deploys, 30 probes each</text>

  <!-- Stage 1: LOAD -->
  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . LOAD</text>
  <text x="30" y="142" class="stage-title">Read the files</text>
  <text x="30" y="162" class="stage-sub">two input files</text>
  <text x="30" y="177" class="stage-sub">30 probes per run</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>

  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: SNAPSHOT PIN -->
  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="209" y="120" class="stage-num">2 . SNAPSHOT PIN</text>
  <text x="209" y="142" class="stage-title">Served id = pin?</text>
  <text x="209" y="162" class="stage-sub">exact string match</text>
  <text x="209" y="177" class="stage-sub">any other id: BLOCK</text>
  <text x="209" y="212" class="meta-block">17 of 64 off the pin</text>

  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: COVERAGE -->
  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="388" y="120" class="stage-num">3 . COVERAGE</text>
  <text x="388" y="142" class="stage-title">Probe has result?</text>
  <text x="388" y="162" class="stage-sub">no result: BLOCK if</text>
  <text x="388" y="177" class="stage-sub">high severity, else</text>
  <text x="388" y="192" class="stage-sub">REVIEW</text>
  <text x="388" y="212" class="meta-block">4 of 64 files short</text>

  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: PASS-RATE DROP -->
  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="567" y="120" class="stage-num">4 . PASS-RATE DROP</text>
  <text x="567" y="142" class="stage-title">Mean vs baseline</text>
  <text x="567" y="162" class="stage-sub">over 3 points: REVIEW</text>
  <text x="567" y="177" class="stage-sub">over 5 points: BLOCK</text>
  <text x="567" y="212" class="meta-block">11 of 64 lost over 5</text>

  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: PROBE COLLAPSE -->
  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . PROBE COLLAPSE</text>
  <text x="746" y="142" class="stage-title">High-severity dip</text>
  <text x="746" y="162" class="stage-sub">fell 50 points or</text>
  <text x="746" y="177" class="stage-sub">more under baseline</text>
  <text x="746" y="192" class="stage-sub">gives BLOCK</text>
  <text x="746" y="212" class="meta-strong">5 of 5 silent dips</text>

  <!-- Arrow from stage 5 down to the decision -->
  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Output: DECISION -->
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . REVIEW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">highest finding wins - BLOCK exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">25 of 25 should-block stopped, 0 of 31 fine blocked</text>

  <!-- CI job box -->
  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Design only box -->
  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">pin change by review</text>
  <text x="742" y="328" class="stage-sub">decision ledger</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <!-- Comparison strip -->
  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No gate</text>
  <text x="32" y="406" class="meta-block">0 of 64 deploys stopped</text>
  <text x="32" y="424" class="stage-sub">17 of 64 had a probe off the pin</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Pass-rate floor 0.90</text>
  <text x="332" y="406" class="meta-block">13 of 25 should-block stopped</text>
  <text x="332" y="424" class="stage-sub">6 silent swaps score flat and pass</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Eval Gate, four rules</text>
  <text x="632" y="406" class="meta-strong">25 of 25 stopped, 0 of 31 fine blocked</text>
  <text x="632" y="424" class="stage-sub">known miss: 3 subtle drifts pass</text>
</svg>
