<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Gate: one pull request, its evidence checked against the tier it owes, ending in one decision</title>
  <desc id="desc">Five-stage flow showing how a pull request description moves through a read step that parses the change record, a tier check that takes the bar from the registry, a listed and ticked check, a file check against the repository file listing and a date check against the freshness limit, ending in one decision of ALLOW, REVIEW or BLOCK that sets the exit code of the CI job. A dashed box marks the pieces that are design only. A comparison strip contrasts a process with no check, a rule that every box is ticked and Evidence Gate on 107 synthetic pull request descriptions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #5a5a5a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #161b22; stroke: #8b9bc7; }
        .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
        .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
        .stage-box-block { fill: #161b22; stroke: #f07878; }
        .stage-box-ship { fill: #161b22; stroke: #4ade80; }
        .stage-box-design { stroke: #9ca3af; }
        .strip-box { fill: #1c2128; stroke: #3b434d; }
        .stage-title { fill: #e6edf3; }
        .stage-sub { fill: #a8b3bf; }
        .stage-num { fill: #b6c4ee; }
        .arrow-line { stroke: #a8b3bf; }
        .arrow-head { fill: #a8b3bf; }
        .meta-strong { fill: #6ee7a0; }
        .meta-block { fill: #fca5a5; }
        .header { fill: #e6edf3; }
        .subheader { fill: #a8b3bf; }
        .badge-bg { fill: #1f2d44; }
        .badge-text { fill: #cfe0f7; }
      }
    </style>
  </defs>

  <text x="20" y="32" class="header">Evidence Gate - one pull request, checked against the evidence its tier owes</text>
  <text x="20" y="52" class="subheader">Five checks read one description, a tier table, a registry and a file listing. The strictest finding sets the decision.</text>

  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 107 pull request descriptions, 36 use cases</text>

  <rect x="20" y="100" width="164" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . READ</text>
  <text x="30" y="142" class="stage-title">Parse the record</text>
  <text x="30" y="162" class="stage-sub">comments and fences</text>
  <text x="30" y="177" class="stage-sub">are not read</text>
  <text x="30" y="192" class="stage-sub">no record: BLOCK</text>
  <text x="30" y="212" class="meta-strong">bad input: exit 2</text>
  <line x1="186" y1="166" x2="197" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="199" y="100" width="164" height="132" rx="8" class="stage-box-gate"/>
  <text x="209" y="120" class="stage-num">2 . TIER BAR</text>
  <text x="209" y="142" class="stage-title">Registry sets bar</text>
  <text x="209" y="162" class="stage-sub">label differs: REVIEW</text>
  <text x="209" y="177" class="stage-sub">not in registry:</text>
  <text x="209" y="192" class="stage-sub">author's tier, REVIEW</text>
  <text x="209" y="212" class="meta-strong">6 of 6 to review</text>
  <line x1="365" y1="166" x2="376" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="378" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="388" y="120" class="stage-num">3 . LISTED, TICKED</text>
  <text x="388" y="142" class="stage-title">Item present?</text>
  <text x="388" y="162" class="stage-sub">line missing: BLOCK</text>
  <text x="388" y="177" class="stage-sub">box empty: BLOCK</text>
  <text x="388" y="192" class="stage-sub">no ref: BLOCK</text>
  <text x="388" y="212" class="meta-block">ticks alone: 8 of 59</text>
  <line x1="544" y1="166" x2="555" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="557" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="567" y="120" class="stage-num">4 . FILE</text>
  <text x="567" y="142" class="stage-title">File in the repo?</text>
  <text x="567" y="162" class="stage-sub">not in listing: BLOCK</text>
  <text x="567" y="177" class="stage-sub">outside repo: BLOCK</text>
  <text x="567" y="192" class="stage-sub">web link: REVIEW</text>
  <text x="567" y="212" class="meta-block">gate w/o it: 44 of 59</text>
  <line x1="723" y1="166" x2="734" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="736" y="100" width="164" height="132" rx="8" class="stage-box-block"/>
  <text x="746" y="120" class="stage-num">5 . DATE</text>
  <text x="746" y="142" class="stage-title">Date in range?</text>
  <text x="746" y="162" class="stage-sub">not a date: BLOCK</text>
  <text x="746" y="177" class="stage-sub">future date: BLOCK</text>
  <text x="746" y="192" class="stage-sub">past limit: BLOCK</text>
  <text x="746" y="212" class="meta-block">gate w/o it: 37 of 59</text>

  <path d="M 818 232 L 818 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>
  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">6 . DECISION</text>
  <text x="262" y="313" class="stage-title">ALLOW . REVIEW . BLOCK</text>
  <text x="262" y="330" class="stage-sub">highest finding wins - BLOCK exits 1, bad input exits 2</text>
  <text x="262" y="344" class="meta-strong">49 of 59 should-block stopped, 3 of 42 fine blocked</text>

  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Check fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails at the chosen level</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">registry feed</text>
  <text x="742" y="328" class="stage-sub">decision ledger</text>
  <text x="742" y="343" class="stage-sub">published Action</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">No check</text>
  <text x="32" y="406" class="meta-block">0 of 107 pull requests stopped</text>
  <text x="32" y="424" class="stage-sub">59 of 107 lack the evidence owed</text>

  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Every box ticked</text>
  <text x="332" y="406" class="meta-block">8 of 59 should-block stopped</text>
  <text x="332" y="424" class="stage-sub">51 of 59 pass, 1 of 42 fine stopped</text>

  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">Evidence Gate, five checks</text>
  <text x="632" y="406" class="meta-strong">49 of 59 stopped, 3 of 42 fine blocked</text>
  <text x="632" y="424" class="stage-sub">known miss: 7 of 59 pass</text>

</svg>
