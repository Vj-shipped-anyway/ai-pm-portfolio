<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">KillSwitch: hourly segment signals flowing through scoring, a per-segment trip, a careful return and a drill scorecard</title>
  <desc id="desc">Five-stage flow showing how hourly health signals for each customer segment are scored against the segment's own normal, how only the hurt segment is tripped to the rules path, how it returns once the signals stay clean, and how drills are scored. A comparison strip contrasts the manual switch-off with KillSwitch on the synthetic data.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/>
    </marker>
    <style>
      .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
      .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
      .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
      .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
      .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .stage-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 11px; fill: #5a5a5a; }
      .stage-num { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
      .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; fill: #8a8a8a; }
      .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
      .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
      .timer { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #791F1F; }
      .timer-fast { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 10px; fill: #27500A; }
      .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
      .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #5a5a5a; }
      .badge-bg { fill: #E6F1FB; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: #1c2541; }
    </style>
  </defs>

  <text x="20" y="32" class="header">KillSwitch - trip the hurt segment, come back safely</text>
  <text x="20" y="52" class="subheader">Hourly signals per segment decide the next hour. Only a segment that holds a bad score moves to the rules path.</text>

  <!-- Trigger badge -->
  <rect x="20" y="78" width="300" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="93" class="badge-text">Trigger: a segment score holds above the level</text>

  <!-- Stage 1: SIGNALS -->
  <rect x="20" y="120" width="155" height="110" rx="8" class="stage-box"/>
  <text x="32" y="140" class="stage-num">1 . SIGNALS</text>
  <text x="32" y="162" class="stage-title">Hourly signals</text>
  <text x="32" y="180" class="stage-sub">error, override</text>
  <text x="32" y="195" class="stage-sub">latency, drift</text>
  <text x="32" y="210" class="stage-sub">per segment</text>
  <text x="32" y="223" class="meta-text">8,640 hourly rows</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="175" x2="222" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 2: SCORE -->
  <rect x="225" y="120" width="180" height="110" rx="8" class="stage-box-eval"/>
  <text x="237" y="140" class="stage-num">2 . SCORE</text>
  <text x="237" y="162" class="stage-title">Score each segment</text>
  <text x="237" y="180" class="stage-sub">vs its own normal</text>
  <text x="237" y="195" class="stage-sub">3 hour window</text>
  <text x="237" y="210" class="stage-sub">warn 3.00 trip 4.0</text>
  <text x="237" y="225" class="meta-strong">fitted on days 1-60</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="175" x2="452" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 3: TRIP -->
  <rect x="455" y="120" width="200" height="110" rx="8" class="stage-box-gate"/>
  <text x="467" y="140" class="stage-num">3 . TRIP</text>
  <text x="467" y="162" class="stage-title">Trip the hurt segment</text>
  <text x="467" y="180" class="stage-sub">2 hours running</text>
  <text x="467" y="195" class="stage-sub">rules path, 6 h cool-off</text>
  <text x="467" y="210" class="stage-sub">healthy segments stay</text>
  <text x="467" y="225" class="meta-block">4 of 5 held-out tripped</text>

  <!-- Arrow 3 -->
  <line x1="660" y1="175" x2="702" y2="175" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 4: RETURN -->
  <rect x="705" y="120" width="180" height="110" rx="8" class="stage-box-ship"/>
  <text x="717" y="140" class="stage-num">4 . RETURN</text>
  <text x="717" y="162" class="stage-title">Return when clean</text>
  <text x="717" y="180" class="stage-sub">under 2.00 for 4 h</text>
  <text x="717" y="195" class="stage-sub">no flapping</text>
  <text x="717" y="210" class="stage-sub">median 14 h after end</text>
  <text x="717" y="225" class="meta-strong">0 re-trips in 17 returns</text>

  <!-- Arrow 4 (down) -->
  <path d="M 795 230 L 795 256 L 410 256 L 410 286" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Stage 5: DRILL -->
  <rect x="240" y="290" width="340" height="90" rx="8" class="stage-box-block"/>
  <text x="252" y="310" class="stage-num">5 . DRILL AND SCORE</text>
  <text x="252" y="330" class="stage-title">Prove the switch works</text>
  <text x="252" y="352" class="stage-sub">worked, fast enough, fresh rules version</text>
  <text x="252" y="368" class="meta-block">0 of 7 scenarios ready, 4 of 10 drills failed</text>

  <!-- Arrow 5 (back) -->
  <path d="M 240 330 L 100 330 L 100 380" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Final: DECISIONS -->
  <rect x="20" y="385" width="160" height="55" rx="8" class="stage-box-ship"/>
  <text x="32" y="405" class="stage-title">decisions flow</text>
  <text x="32" y="423" class="stage-sub">healthy segments</text>
  <text x="32" y="436" class="meta-strong">0 dragged along</text>

  <!-- Comparison strip -->
  <rect x="600" y="290" width="285" height="90" rx="8" fill="#f6f5f2" stroke="none"/>
  <text x="612" y="310" class="stage-title">Same events, two worlds</text>
  <text x="612" y="332" class="timer">Manual: switched for 2 of 12 events</text>
  <text x="612" y="350" class="timer-fast">KillSwitch: tripped for 9 of 12</text>
  <text x="612" y="370" class="meta-strong">known limit: 3 silent errors unseen</text>
</svg>
