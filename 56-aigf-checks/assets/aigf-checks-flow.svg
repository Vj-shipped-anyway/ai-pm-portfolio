<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">aigf-checks: a crosswalk of framework risks to runnable checks, re-read against what each check printed</title>
  <desc id="desc">Four-stage flow showing how a risk catalogue, a check registry, a crosswalk and the captured output of each check move through a read and validate step, an id and duplicate check, a comparison of each claim with the labelled line the check printed, and a check of aspects and note wording, ending in findings per row, a status per risk and an exit code. A dashed box marks the pieces that are design only. A comparison strip contrasts a sheet nobody re-runs, a link-and-grep pass and aigf-checks on 73 synthetic crosswalk rows.</desc>

  <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
      </marker>
      <style>
        .stage-box { fill: #ffffff; stroke: #1c2541; stroke-width: 1.5; }
        .stage-box-eval { fill: #ffffff; stroke: #1d4e89; stroke-width: 1.5; }
        .stage-box-gate { fill: #ffffff; stroke: #d97706; stroke-width: 1.5; }
        .stage-box-block { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; }
        .stage-box-ship { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; }
        .stage-box-design { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
        .strip-box { fill: #f6f5f2; stroke: #d6d3cc; stroke-width: 1; }
        .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
        .stage-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #4b5563; }
        .stage-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
        .arrow-line { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
        .arrow-head { fill: #5a5a5a; }
        .meta-strong { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #14532d; }
        .meta-block { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #7f1d1d; }
        .header { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 500; fill: #1a1a1a; }
        .subheader { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #4b5563; }
        .badge-bg { fill: #E6F1FB; }
        .badge-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; fill: #1c2541; }
        @media (prefers-color-scheme: dark) {
          .stage-box { fill: #161b22; stroke: #8b9bc7; }
          .stage-box-eval { fill: #161b22; stroke: #6ea8e0; }
          .stage-box-gate { fill: #161b22; stroke: #f0a63a; }
          .stage-box-block { fill: #161b22; stroke: #f07878; }
          .stage-box-ship { fill: #161b22; stroke: #4ade80; }
          .stage-box-design { stroke: #9ca3af; }
          .strip-box { fill: #1c2128; stroke: #3b434d; }
          .stage-title { fill: #e6edf3; }
          .stage-sub { fill: #a8b3bf; }
          .stage-num { fill: #b6c4ee; }
          .arrow-line { stroke: #a8b3bf; }
          .arrow-head { fill: #a8b3bf; }
          .meta-strong { fill: #6ee7a0; }
          .meta-block { fill: #fca5a5; }
          .header { fill: #e6edf3; }
          .subheader { fill: #a8b3bf; }
          .badge-bg { fill: #1f2d44; }
          .badge-text { fill: #cfe0f7; }
        }
      </style>
    </defs>

  <text x="20" y="32" class="header">aigf-checks - each crosswalk row re-read against what the check printed</text>
  <text x="20" y="52" class="subheader">Four checks read a crosswalk and captured output. Each risk then gets one status.</text>

  <rect x="20" y="66" width="330" height="22" rx="4" class="badge-bg"/>
  <text x="28" y="81" class="badge-text">Input: 24 risks, 20 checks, 73 crosswalk rows</text>

  <rect x="20" y="100" width="205" height="132" rx="8" class="stage-box"/>
  <text x="30" y="120" class="stage-num">1 . READ</text>
  <text x="30" y="142" class="stage-title">Read four files</text>
  <text x="30" y="162" class="stage-sub">risks, checks, crosswalk</text>
  <text x="30" y="177" class="stage-sub">captured output as JSON</text>
  <text x="30" y="192" class="stage-sub">bad input: exit 2</text>
  <text x="30" y="212" class="meta-strong">never a silent pass</text>
  <line x1="227" y1="166" x2="243" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="245" y="100" width="205" height="132" rx="8" class="stage-box-gate"/>
  <text x="255" y="120" class="stage-num">2 . RESOLVE</text>
  <text x="255" y="142" class="stage-title">Ids exist, once</text>
  <text x="255" y="162" class="stage-sub">unknown risk: finding</text>
  <text x="255" y="177" class="stage-sub">unknown check: finding</text>
  <text x="255" y="192" class="stage-sub">same claim twice: finding</text>
  <text x="255" y="212" class="meta-block">grep alone: 3 of 3 pass</text>
  <line x1="452" y1="166" x2="468" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="470" y="100" width="205" height="132" rx="8" class="stage-box-block"/>
  <text x="480" y="120" class="stage-num">3 . COMPARE</text>
  <text x="480" y="142" class="stage-title">Claim vs printed line</text>
  <text x="480" y="162" class="stage-sub">label found, value equal</text>
  <text x="480" y="177" class="stage-sub">no output: finding</text>
  <text x="480" y="192" class="stage-sub">wrong value: finding</text>
  <text x="480" y="212" class="meta-block">grep alone: 11 of 45 found</text>
  <line x1="677" y1="166" x2="693" y2="166" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="695" y="100" width="205" height="132" rx="8" class="stage-box-block"/>
  <text x="705" y="120" class="stage-num">4 . ASPECTS</text>
  <text x="705" y="142" class="stage-title">Aspects and wording</text>
  <text x="705" y="162" class="stage-sub">full needs every aspect</text>
  <text x="705" y="177" class="stage-sub">compliant, certified,</text>
  <text x="705" y="192" class="stage-sub">guarantee: finding</text>
  <text x="705" y="212" class="meta-block">grep alone: 7 of 7 pass</text>

  <path d="M 797 232 L 797 252 L 470 252 L 470 270" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="250" y="272" width="440" height="78" rx="8" class="stage-box-ship"/>
  <text x="262" y="292" class="stage-num">5 . STATUS AND EXIT</text>
  <text x="262" y="313" class="stage-title">CHECKED . PARTIAL . UNVERIFIED . GAP</text>
  <text x="262" y="330" class="stage-sub">exit 1 when a row has a finding, exit 2 on bad input</text>
  <text x="262" y="344" class="meta-strong">38 of 45 found, 0 of 28 harmless flagged</text>

  <rect x="20" y="272" width="190" height="78" rx="8" class="stage-box"/>
  <text x="32" y="292" class="stage-num">CI JOB</text>
  <text x="32" y="313" class="stage-title">Step fails or passes</text>
  <text x="32" y="330" class="stage-sub">fails on any finding</text>
  <text x="32" y="344" class="stage-sub">annotations on request</text>
  <line x1="248" y1="311" x2="214" y2="311" class="arrow-line" marker-end="url(#arrow)"/>

  <rect x="730" y="272" width="170" height="78" rx="8" class="stage-box-design"/>
  <text x="742" y="292" class="stage-num">DESIGN ONLY</text>
  <text x="742" y="313" class="stage-sub">capture in the same job</text>
  <text x="742" y="328" class="stage-sub">reviewed crosswalk repo</text>
  <text x="742" y="343" class="stage-sub">status record</text>

  <rect x="20" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="32" y="386" class="stage-title">Sheet nobody re-runs</text>
  <text x="32" y="406" class="meta-block">0 of 73 rows flagged</text>
  <text x="32" y="424" class="stage-sub">45 of 73 carry a planted defect</text>
  <rect x="320" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="332" y="386" class="stage-title">Link and grep</text>
  <text x="332" y="406" class="meta-block">11 of 45 defective found</text>
  <text x="332" y="424" class="stage-sub">flags 6 of 28 harmless rows</text>
  <rect x="620" y="366" width="280" height="80" rx="8" class="strip-box"/>
  <text x="632" y="386" class="stage-title">aigf-checks</text>
  <text x="632" y="406" class="meta-strong">38 of 45 found, 0 of 28 flagged</text>
  <text x="632" y="424" class="stage-sub">known miss: 7 of 45 pass</text>
</svg>
